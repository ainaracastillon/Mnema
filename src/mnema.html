<title>Mnema</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: app shell — brand bar + sticky tab rail, one working column (max 1080px) per tab */
:root{
  --bg:#F4F6FC; --surface:#FFFFFF; --surface-2:#EAEFFA; --line:#D7DEF0;
  --ink:#131A4A; --ink-2:#4B5479; --ink-3:#6A7396;
  --anil:#1F2C86; --spark:#4A7DFF; --spark-ink:#2C55D6; --spark-soft:#DCE6FF;
  --btn-bg:#1F2C86; --btn-ink:#FFFFFF;
  --good:#17824F; --good-soft:#DDF3E8; --warn:#9A6400; --warn-soft:#FCEFD6; --bad:#B93A33; --bad-soft:#FBE3E1;
  --shadow:0 1px 2px rgba(19,26,74,.06),0 6px 20px rgba(19,26,74,.06);
  --f-display:'Unbounded','DM Sans',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B2350; --surface:#252F64; --surface-2:#2E3972; --line:#414D8C;
  --ink:#F0F3FF; --ink-2:#C6CEF0; --ink-3:#A3AED8;
  --anil:#AFC6FF; --spark:#86ABFF; --spark-ink:#BCD0FF; --spark-soft:#33438C;
  --btn-bg:#86ABFF; --btn-ink:#141A3E;
  --good:#74E3AD; --good-soft:#22504A; --warn:#F7CC7A; --warn-soft:#524426; --bad:#FFA39B; --bad-soft:#5E2C42;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1B2350; --surface:#252F64; --surface-2:#2E3972; --line:#414D8C;
  --ink:#F0F3FF; --ink-2:#C6CEF0; --ink-3:#A3AED8;
  --anil:#AFC6FF; --spark:#86ABFF; --spark-ink:#BCD0FF; --spark-soft:#33438C;
  --btn-bg:#86ABFF; --btn-ink:#141A3E;
  --good:#74E3AD; --good-soft:#22504A; --warn:#F7CC7A; --warn-soft:#524426; --bad:#FFA39B; --bad-soft:#5E2C42;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--spark);outline-offset:2px;border-radius:6px}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand .word{font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:-.5px}
.brand svg .ln{stroke:var(--anil)} .brand svg .nd{fill:var(--anil)} .brand svg .hub{fill:var(--spark)}
.subj{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.subj select{max-width:260px;min-width:0}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:0 0}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:10px 14px 12px;font-weight:500;color:var(--ink-2);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;border-radius:0}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--spark)}

main{padding-block:24px 64px}
h1,h2,h3{margin:0;text-wrap:balance}
h2.sec{font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:-.3px}
h3{font-size:16px;font-weight:700}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.panel.flat{background:var(--surface-2);border-color:transparent}

select,input[type=text],input[type=date],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:40px;max-width:100%}
textarea{width:100%;resize:vertical;min-height:90px;line-height:1.5}
label.lbl{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2);font-weight:500}
.btn{appearance:none;border:1px solid transparent;background:var(--btn-bg);color:var(--btn-ink);padding:9px 16px;border-radius:10px;font-weight:500;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.soft{background:var(--spark-soft);color:var(--spark-ink)}
.btn.small{min-height:34px;padding:6px 12px;font-size:14px}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.spark{background:var(--spark-soft);color:var(--spark-ink)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--spark)}
.bar.good > i{background:var(--good)} .bar.warn > i{background:var(--warn)} .bar.bad > i{background:var(--bad)}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:2s}}

/* Hoy */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.count{font-family:var(--f-display);font-weight:600;font-size:44px;line-height:1;letter-spacing:-1px;color:var(--anil)}
.plan-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plan-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.plan-item .dot{width:10px;height:10px;border-radius:50%;background:var(--spark);flex-shrink:0}
.plan-item.done .dot{background:var(--good)}
.plan-item .txt{flex:1;min-width:0}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{background:var(--surface-2);border-radius:10px;padding:8px 6px;min-height:86px;font-size:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.day b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.day .t{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;color:var(--ink)}
.day.today{background:var(--spark-soft)}
.day.exam{background:var(--anil);color:var(--surface)} .day.exam b,.day.exam .t{color:var(--surface)}
@media (max-width:560px){.week{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pomo{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.pomo .clock{font-family:var(--f-mono);font-size:52px;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
.ring{position:relative;width:180px;height:180px;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

/* Temario */
.drop{border:2px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--spark);background:var(--spark-soft)}
.mat{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.mat:first-child{border-top:0}
.mat .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.topic{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.topic-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px}
.topic-h .idx{font-family:var(--f-mono);color:var(--ink-3);font-size:13px;width:26px}
.topic-h .tt{font-weight:700;min-width:0}
.topic-h .kt{font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topic-acts{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 14px 54px}
@media (max-width:560px){.topic-acts{padding-left:16px}}
.topic-body{border-top:1px solid var(--line);padding:18px 20px 20px 54px;background:var(--surface)}
@media (max-width:560px){.topic-body{padding-left:20px}}
.md{max-width:68ch}
.md h4{font-size:15px;margin:18px 0 6px;font-weight:700}
.md p{margin:0 0 10px}
.md ul{margin:0 0 10px;padding-left:20px}
.md li{margin:3px 0}
mark{background:var(--spark-soft);color:var(--ink);padding:0 3px;border-radius:4px;box-shadow:inset 0 -2px 0 var(--spark)}
.status{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--spark-soft);color:var(--spark-ink);font-weight:500;font-size:14px}
.status.err{background:var(--bad-soft);color:var(--bad)}

/* Tarjetas */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat .v{font-family:var(--f-mono);font-size:26px;line-height:1.1;color:var(--ink)}
.stat .k{font-size:12.5px;color:var(--ink-3)}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:28px 24px;min-height:260px;display:flex;flex-direction:column;gap:14px;max-width:680px;margin:0 auto;width:100%}
.flash .q{font-size:21px;font-weight:500;line-height:1.35;text-wrap:balance}
.flash .a{font-size:17px;border-top:1px dashed var(--line);padding-top:14px}
.flash .src{font-size:13px;color:var(--ink-3);font-style:italic}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:680px;margin:0 auto;width:100%}
.grades .btn{flex-direction:column;gap:0;padding:8px 6px;min-height:52px}
.grades .btn small{font-family:var(--f-mono);font-size:11.5px;opacity:.8;font-weight:400}
.g0{background:var(--bad-soft);color:var(--bad)} .g1{background:var(--warn-soft);color:var(--warn)} .g2{background:var(--spark-soft);color:var(--spark-ink)} .g3{background:var(--good-soft);color:var(--good)}
.clist{display:flex;flex-direction:column}
.crow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:start;font-size:14px}
@media (max-width:620px){.crow{grid-template-columns:minmax(0,1fr) auto}.crow .ca{grid-column:1/2}}

/* Tests */
.qcard{max-width:720px;margin:0 auto;width:100%}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{appearance:none;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--spark)}
.opt .l{font-family:var(--f-mono);color:var(--ink-3);flex-shrink:0}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ko{border-color:var(--bad);background:var(--bad-soft)}
.opt.pick{border-color:var(--spark);background:var(--spark-soft)}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:12px 14px;font-size:14.5px}
.fb.ok{background:var(--good-soft)} .fb.ko{background:var(--bad-soft)} .fb.mid{background:var(--warn-soft)}
.fb b{display:block;margin-bottom:2px}
.progress-line{display:flex;align-items:center;gap:12px}
.progress-line .bar{flex:1}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.check{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface);min-height:40px}
.check input{accent-color:var(--spark);width:16px;height:16px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{appearance:none;border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:500;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.res{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.res .ic{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:2px}
.ic.ok{background:var(--good-soft);color:var(--good)} .ic.ko{background:var(--bad-soft);color:var(--bad)} .ic.mid{background:var(--warn-soft);color:var(--warn)}

/* Tutor */
.chat{display:flex;flex-direction:column;gap:12px;min-height:280px;max-height:min(60vh,620px);overflow-y:auto;padding:4px 2px}
.msg{max-width:min(78ch,88%);padding:12px 14px;border-radius:14px;line-height:1.55;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--btn-bg);color:var(--btn-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.msg.ai .md{max-width:none}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:48px;max-height:160px;flex:1}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;color:var(--ink-2);min-height:34px}
.quick button:hover{border-color:var(--spark);color:var(--ink)}

/* Progreso */
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(80px,220px) 48px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.mrow:first-child{border-top:0}
.mrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:320px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--surface-2);display:block;max-width:100%}
.heat i.l1{background:color-mix(in srgb,var(--spark) 30%,var(--surface-2))}
.heat i.l2{background:color-mix(in srgb,var(--spark) 60%,var(--surface-2))}
.heat i.l3{background:var(--spark)}
.heat i.t{outline:2px solid var(--anil);outline-offset:1px}

.empty{text-align:center;padding:36px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty p{max-width:46ch;margin:0}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--surface-2);font-size:14px}
.banner .t{flex:1;min-width:200px}

.modal{position:fixed;inset:0;z-index:30;background:rgba(10,16,53,.5);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .box{background:var(--surface);border-radius:18px;padding:22px;width:min(520px,100%);max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.foot{font-size:12.5px;color:var(--ink-3);text-align:center;padding-block:8px 0}

/* Vistas del tema */
.tview{margin-bottom:14px}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.mind{min-width:760px}
.mind text{font-family:var(--f-body)}
table.cmp{border-collapse:collapse;font-size:14px;min-width:520px;width:100%}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
table.cmp thead th{background:var(--surface-2);font-weight:700}
table.cmp tbody th{background:var(--surface-2);font-weight:500;color:var(--ink)}
.pod{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow-y:auto;padding-right:4px}
.pline{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;padding:8px 10px;border-radius:10px;font-size:14.5px}
.pline b{font-size:12.5px;color:var(--ink-3);font-weight:700;padding-top:2px}
.pline.B b{color:var(--spark-ink)}
.pline.on{background:var(--spark-soft)}

/* Lector */
.reader{white-space:pre-wrap;font-size:15.5px;line-height:1.7;max-height:min(62vh,640px);overflow-y:auto;padding:4px 6px 4px 2px;max-width:72ch;overflow-wrap:anywhere}
.reader mark{cursor:pointer}
.reader mark[data-n]::after{content:attr(data-n);font-size:10.5px;font-weight:700;vertical-align:super;margin-left:2px;color:var(--spark-ink);font-family:var(--f-mono)}
.rbar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:var(--shadow)}
.hl-list{display:flex;flex-direction:column}
.hl{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;align-items:start}
.hl .n{font-family:var(--f-mono);color:var(--spark-ink);font-size:13px;padding-top:1px}

/* Juegos */
.match{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mcard{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;min-height:72px;cursor:pointer;text-align:left;font-size:14px;line-height:1.35;display:flex;align-items:center;transition:opacity .25s,transform .15s}
.mcard:hover{border-color:var(--spark)}
.mcard.sel{border-color:var(--spark);background:var(--spark-soft)}
.mcard.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
.mcard.gone{opacity:0;pointer-events:none}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion: reduce){.mcard.bad{animation:none}}

/* Imagen tapada */
.occ{position:relative;display:inline-block;max-width:100%;line-height:0;user-select:none;-webkit-user-select:none;touch-action:none}
.occ img{max-width:100%;display:block;border-radius:10px}
.occ .r{position:absolute;border-radius:4px;background:var(--anil);border:2px solid var(--anil);display:flex;align-items:center;justify-content:center;color:var(--surface);font-size:12px;font-weight:700;line-height:1.1;text-align:center;padding:2px;overflow:hidden}
.occ .r.target{background:var(--spark);border-color:var(--spark)}
.occ .r.shown{background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--ink);border-color:var(--good)}

const EX_TEXT=`TEMA 1. LA TEORÍA CELULAR
La teoría celular afirma que todos los seres vivos están formados por una o más células, que la célula es la unidad estructural y funcional de los seres vivos y que toda célula procede de otra célula preexistente. Robert Hooke observó en 1665 celdillas en una lámina de corcho y las llamó células. Schleiden (1838) y Schwann (1839) propusieron que plantas y animales están formados por células. Virchow (1855) añadió el principio "omnis cellula e cellula": toda célula procede de otra célula.

TEMA 2. CÉLULA PROCARIOTA Y EUCARIOTA
Las células procariotas no tienen núcleo: su material genético (ADN circular) está en una región llamada nucleoide. Son más pequeñas (1-10 µm), carecen de orgánulos membranosos y tienen ribosomas 70S. Las bacterias son procariotas. Las células eucariotas tienen un núcleo rodeado por una envoltura nuclear, son mayores (10-100 µm), poseen orgánulos membranosos y ribosomas 80S. Animales, plantas, hongos y protoctistas son eucariotas. La célula vegetal tiene pared celular de celulosa, cloroplastos y una gran vacuola; la animal tiene centriolos y carece de pared celular.

TEMA 3. ORGÁNULOS CELULARES
Las mitocondrias realizan la respiración celular y producen energía en forma de ATP; tienen doble membrana y ADN propio. Los cloroplastos, presentes en células vegetales, realizan la fotosíntesis gracias a la clorofila. El retículo endoplasmático rugoso tiene ribosomas adheridos y participa en la síntesis de proteínas; el liso sintetiza lípidos. El aparato de Golgi modifica, empaqueta y distribuye las proteínas en vesículas. Los lisosomas contienen enzimas digestivas y realizan la digestión celular.`;

/* ---------- almacenamiento ---------- */
const LS_KEY='mnema.v1';
const Store={
  mode:'local',db:null,uid:null,timers:{},chains:{},
  loadLocal(){
    try{const raw=localStorage.getItem(LS_KEY);if(!raw)return;const d=JSON.parse(raw);
      Object.assign(S.subjects,d.subjects||{});Object.assign(S.materials,d.materials||{});Object.assign(S.images,d.images||{});if(d.meta)S.meta=Object.assign(S.meta,d.meta);}catch(e){}
  },
  saveLocal(){
    clearTimeout(this.timers.__local);
    this.timers.__local=setTimeout(()=>{try{localStorage.setItem(LS_KEY,JSON.stringify({subjects:S.subjects,materials:S.materials,images:S.images,meta:S.meta}))}catch(e){
      toast('No se pudo guardar en este navegador: el temario es demasiado grande. Inicia sesión en Claude para guardarlo en la nube.')}},500);
  },
  path(){return 'data/users/'+this.uid},
  async init(){
    const C=window.claude; if(!C||!C.use) return;
    let db=null,user=null;
    try{[db,user]=await Promise.all([C.use('db'),C.use('user')])}catch(e){}
    if(!db||!user) return;
    let id=null; try{id=await user.id()}catch(e){}
    if(!id) return;
    this.db=db;this.uid=id;this.user=user;
    try{
      const snap=await db.collection(this.path()).limit(1000).get();
      const remote={subjects:{},materials:{},images:{},meta:null};
      for(const d of snap.docs){const v=d.data();if(!v)continue;
        if(d.id==='meta')remote.meta=v;else if(d.id.startsWith('s_'))remote.subjects[v.id]=JSON.parse(JSON.stringify(v));else if(d.id.startsWith('m_'))remote.materials[v.id]=JSON.parse(JSON.stringify(v));else if(d.id.startsWith('i_'))remote.images[v.id]=JSON.parse(JSON.stringify(v));}
      const hasRemote=remote.meta||Object.keys(remote.subjects).length;
      this.mode='db';
      if(hasRemote){
        S.subjects=remote.subjects;S.materials=remote.materials;S.images=remote.images;if(remote.meta)S.meta=Object.assign({streak:{count:0,last:null},log:{},pomos:{}},JSON.parse(JSON.stringify(remote.meta)));
      }else if(Object.keys(S.subjects).length){
        for(const s of Object.values(S.subjects))this.save('s',s);
        for(const m of Object.values(S.materials))this.save('m',m);
        for(const m of Object.values(S.images))this.save('i',m);
        this.save('meta');
      }
      try{localStorage.removeItem(LS_KEY)}catch(e){}
      render();
    }catch(e){this.mode='local';}
  },
  key(kind,obj){return kind==='meta'?'meta':kind+'_'+obj.id},
  save(kind,obj){
    if(kind!=='meta'&&obj&&obj.example)return;
    if(this.mode!=='db'){this.saveLocal();return}
    const k=this.key(kind,obj);
    clearTimeout(this.timers[k]);
    this.timers[k]=setTimeout(()=>{
      let body=kind==='meta'?S.meta:(kind==='s'?S.subjects[obj.id]:kind==='i'?S.images[obj.id]:S.materials[obj.id]);
      if(!body)return;
      body=JSON.parse(JSON.stringify(body));
      if(kind==='s'){
        let size=JSON.stringify(body).length;
        if(size>240000&&body.answers){body.answers=body.answers.slice(-200);size=JSON.stringify(body).length}
        if(size>250000){toast('Esta asignatura ocupa demasiado para guardarse entera. Borra tarjetas o temas que no uses.');return}
      }
      const ref=this.db.doc(this.path()+'/'+k);
      this.chains[k]=(this.chains[k]||Promise.resolve()).then(()=>ref.set(body)).catch(e=>{
        if(e&&e.code==='quota_exceeded')toast('Se ha llenado el espacio de Mnema. Borra materiales que ya no uses.');
        else toast('No se pudo guardar: '+(e&&e.message||'error de conexión'));
      });
    },600);
  },
  remove(kind,id){
    if(this.mode!=='db'){this.saveLocal();return}
    const k=kind+'_'+id;clearTimeout(this.timers[k]);
    const ref=this.db.doc(this.path()+'/'+k);
    this.chains[k]=(this.chains[k]||Promise.resolve()).then(()=>ref.delete()).catch(()=>{});
  }
};

function chunksOf(text,size=2200){
  const parts=[];const paras=text.split(/\n\s*\n/);let buf='';
  for(const p of paras){if((buf+p).length>size&&buf){parts.push(buf);buf=''}buf+=(buf?'\n\n':'')+p;
    while(buf.length>size*1.6){parts.push(buf.slice(0,size));buf=buf.slice(size)}}
  if(buf)parts.push(buf);return parts;
}
function contextFor(subj,topic,cap=140000){
  const mats=materialsOf(subj.id);
  if(!mats.length)return subj.topics.map(t=>'## '+t.title+'\n'+(t.summary||'')+'\n'+subj.cards.filter(c=>c.topicId===t.id&&c.type!=='img').map(c=>'- '+c.q+' → '+c.a).join('\n')).join('\n\n').slice(0,cap);
  let full=mats.map(m=>'### '+m.name+'\n'+m.text).join('\n\n');
  if(full.length<=cap||!topic)return full.slice(0,cap);
  const words=new Set(norm([topic.title].concat(topic.keyTerms||[]).join(' ')).split(/[^a-z0-9ñ]+/).filter(w=>w.length>3));
  const chunks=chunksOf(full).map((c,i)=>{const n=norm(c);let sc=0;words.forEach(w=>{let k=0,p=0;while((p=n.indexOf(w,p))!==-1){k++;p+=w.length}sc+=k});return{c,i,sc}});
  const pick=[];let len=0;
  for(const x of chunks.slice().sort((a,b)=>b.sc-a.sc)){if(len+x.c.length>cap*0.6)break;pick.push(x);len+=x.c.length}
  return pick.sort((a,b)=>a.i-b.i).map(x=>x.c).join('\n\n[…]\n\n');
}
function topicLine(subj){return subj.topics.map((t,i)=>(i+1)+'. '+t.title).join('\n')}

function cardMastery(c){return c.reps>0?clamp(c.interval/21,0,1):0}
function topicMastery(subj,tid){
  const cs=subj.cards.filter(c=>c.topicId===tid);
  const as=(subj.answers||[]).filter(a=>a.topicId===tid).slice(-12);
  const t=subj.topics.find(x=>x.id===tid);
  const parts=[];
  if(cs.length)parts.push([cs.reduce((s,c)=>s+cardMastery(c),0)/cs.length,0.5]);
  if(as.length)parts.push([as.filter(a=>a.ok).length/as.length,0.4]);
  if(t&&t.read)parts.push([1,0.1]); else parts.push([0,0.1]);
  const w=parts.reduce((s,p)=>s+p[1],0);
  return w?parts.reduce((s,p)=>s+p[0]*p[1],0)/w:0;
}
function subjectMastery(subj){if(!subj.topics.length)return 0;return subj.topics.reduce((s,t)=>s+topicMastery(subj,t.id),0)/subj.topics.length}
function dueCards(subj,topic='all'){const d=today();return subj.cards.filter(c=>(topic==='all'||c.topicId===topic)&&c.due<=d)}
function gradeCard(c,g){
  const d=today();
  if(g===0){c.reps=0;c.interval=0;c.lapses=(c.lapses||0)+1;c.ease=Math.max(1.3,c.ease-0.2)}
  else if(g===1){c.interval=Math.max(1,Math.round((c.interval||1)*1.2));c.ease=Math.max(1.3,c.ease-0.15);c.reps++}
  else if(g===2){c.interval=c.reps===0?1:c.reps===1?3:Math.round(c.interval*c.ease);c.reps++}
  else{c.interval=c.reps===0?4:Math.round(Math.max(c.interval,1)*c.ease*1.3);c.ease+=0.15;c.reps++}
  c.due=addDays(d,c.interval);c.last=d;
}
function nextIntervalLabel(c,g){const x=Object.assign({},c);gradeCard(x,g);return g===0?'hoy':x.interval===1?'1 día':x.interval+' días'}
function markActive(n=1){
  const d=today();S.meta.log[d]=(S.meta.log[d]||0)+n;
  const st=S.meta.streak||{count:0,last:null};
  if(st.last!==d){st.count=st.last===addDays(d,-1)?st.count+1:1;st.last=d}
  S.meta.streak=st;
  const keys=Object.keys(S.meta.log).sort();if(keys.length>120)keys.slice(0,keys.length-120).forEach(k=>delete S.meta.log[k]);
  saveMeta();
}
function streakNow(){const st=S.meta.streak||{};if(!st.last)return 0;const d=today();return(st.last===d||st.last===addDays(d,-1))?st.count:0}
function findTopicId(subj,title){
  if(!title)return subj.topics[0]&&subj.topics[0].id;
  const n=norm(title);
  let t=subj.topics.find(x=>norm(x.title)===n)||subj.topics.find(x=>n.includes(norm(x.title))||norm(x.title).includes(n));
  return t?t.id:(subj.topics[0]&&subj.topics[0].id);
}
function buildPlan(subj){
  const items=[];const d=today();
  const due=dueCards(subj).length;
  const left=subj.examDate?daysBetween(d,subj.examDate):null;
  if(!subj.topics.length){
    if(!materialsOf(subj.id).length)items.push({txt:'Sube tu temario (PDF, Word, fotos o texto)',go:'temario',cta:'Subir'});
    else items.push({txt:'Analiza el temario para dividirlo en temas',go:'temario',cta:'Analizar'});
    return {items,week:[],left};
  }
  if(due)items.push({txt:'Repasa '+due+' tarjeta'+(due>1?'s':'')+' pendiente'+(due>1?'s':''),go:'tarjetas',cta:'Repasar'});
  const ranked=subj.topics.map(t=>({t,m:topicMastery(subj,t.id)})).sort((a,b)=>a.m-b.m);
  const studyDays=left!==null&&left>0?Math.max(1,left-1):7;
  const per=clamp(Math.ceil(ranked.length/studyDays),1,3);
  const actionFor=(t)=>{const n=subj.cards.filter(c=>c.topicId===t.id).length;
    if(!t.summary)return{txt:'Lee el resumen de «'+t.title+'»',go:'temario',topic:t.id,cta:'Resumen'};
    if(n<5)return{txt:'Crea tarjetas de «'+t.title+'»',go:'temario',topic:t.id,cta:'Tarjetas'};
    return{txt:'Haz un test de «'+t.title+'»',go:'tests',topic:t.id,cta:'Test'}};
  if(left!==null&&left>=0&&left<=2)items.push({txt:'Haz un simulacro de examen completo',go:'tests',sim:true,cta:'Simulacro'});
  else ranked.slice(0,per).forEach(x=>items.push(Object.assign(actionFor(x.t),{m:x.m})));
  const week=[];
  for(let i=0;i<7;i++){
    const day=addDays(d,i);let label;
    if(left!==null&&i===left)label='Examen';
    else if(left!==null&&i>left)label='—';
    else if(left!==null&&left-i<=2&&left-i>=1)label='Simulacro + repaso de fallos';
    else{const sl=[];for(let k=0;k<per;k++){const x=ranked[(i*per+k)%ranked.length];if(x&&!sl.includes(x.t.title))sl.push(x.t.title)}label=sl.join(' · ')}
    week.push({day,label,exam:left!==null&&i===left});
  }
  return {items,week,left};
}

/* ---------- markdown ligero ---------- */
function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/==(.+?)==/g,'<mark>$1</mark>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>')}
function md(src){
  const lines=String(src||'').split('\n');let out='',inList=false;
  const close=()=>{if(inList){out+='</ul>';inList=false}};
  for(let raw of lines){const l=raw.trim();
    if(!l){close();continue}
    let m;
    if((m=l.match(/^#{1,4}\s+(.*)/))){close();out+='<h4>'+inl(m[1])+'</h4>';continue}
    if((m=l.match(/^(?:[-*•]|\d+[.)])\s+(.*)/))){if(!inList){out+='<ul>';inList=true}out+='<li>'+inl(m[1])+'</li>';continue}
    close();out+='<p>'+inl(l)+'</p>';
  }
  close();return '<div class="md">'+out+'</div>';
}

function readSelection(){
  const box=$('#reader');const sel=window.getSelection();

  const r=sel.getRangeAt(0);if(!box.contains(r.startContainer)||!box.contains(r.endContainer))return null;
  const pre=document.createRange();pre.selectNodeContents(box);pre.setEnd(r.startContainer,r.startOffset);
  let start=pre.toString().length;let txt=r.toString();let end=start+txt.length;
  const lead=txt.length-txt.trimStart().length,trail=txt.length-txt.trimEnd().length;start+=lead;end-=trail;txt=txt.trim();
  if(txt.length<2)return null;return{mid:box.dataset.mid,start,end,text:txt};
}

/* subida */
async function handleFiles(files){
  const s=cur();if(!s||s.example){toast('Crea primero tu asignatura.');return}
  files=Array.from(files||[]);if(!files.length)return;
  const imgs=files.filter(f=>f.type.startsWith('image/'));
  const docs=files.filter(f=>!f.type.startsWith('image/'));
  let added=0;
  for(const f of docs){
    try{
      setStatus('Leyendo '+f.name+'…');
      let text=await extractFile(f);
      text=cleanText(text);
      if(!text||text.length<30)throw new Error('no se encontró texto en '+f.name);
      addMaterial(s,f.name,text);added++;
    }catch(e){console.warn(e);setStatus('No se pudo leer '+f.name+': '+(e.message||e.code||'formato no reconocido')+'.',true);await pause(2500)}
  }
  if(imgs.length){
    try{const text=await imagesToText(imgs,(i,n)=>setStatus('Transcribiendo fotos con Claude… '+i+' de '+n));if(text.trim()){addMaterial(s,'Fotos de apuntes ('+imgs.length+')',cleanText(text));added++}}
    catch(e){setStatus(errMsg(e),true);await pause(3000)}
  }
  V.status=null;render();
  if(added){toast(added===1?'Material añadido.':added+' materiales añadidos.');if(!s.topics.length)analyze()}
}
const pause=ms=>new Promise(r=>setTimeout(r,ms));
function setStatus(msg,err){V.status={msg,err};if(V.tab==='temario')render()}
function cleanText(t){return String(t||'').replace(/\r/g,'').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').replace(/[ \t]{2,}/g,' ').trim()}
async function extractFile(f){
  const n=f.name.toLowerCase();
  if(n.endsWith('.pdf'))return pdfText(f);
  if(n.endsWith('.docx')){if(!window.mammoth)throw new Error('no se pudo cargar el lector de Word');const r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});return r.value}
  if(n.endsWith('.doc'))throw new Error('guarda el archivo como .docx o PDF');
  return f.text();
}
async function pdfText(f){
  if(!window.pdfjsLib)throw new Error('no se pudo cargar el lector de PDF');
  const doc=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
  let out='';
  for(let p=1;p<=doc.numPages;p++){
    setStatus('Leyendo '+f.name+'… página '+p+' de '+doc.numPages);
    const pg=await doc.getPage(p);const tc=await pg.getTextContent();
    out+=tc.items.map(it=>it.str+(it.hasEOL?'\n':' ')).join('')+'\n\n';
  }
  if(out.replace(/\s/g,'').length<40*doc.numPages){
    const lim=await imageLimits();
    if(!lim)throw new Error('parece escaneado; súbelo como fotos o abre Mnema desde claude.ai');
    const maxP=Math.min(doc.numPages,30);const blobs=[];
    for(let p=1;p<=maxP;p++){setStatus('Preparando páginas escaneadas… '+p+' de '+maxP);const pg=await doc.getPage(p);const vp=pg.getViewport({scale:1.6});const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;blobs.push(await new Promise(r=>cv.toBlob(r,'image/jpeg',0.82)))}
    out=await imagesToText(blobs,(i,n)=>setStatus('Leyendo páginas escaneadas con Claude… '+i+' de '+n));
    if(doc.numPages>maxP)toast('Solo se han leído las primeras '+maxP+' páginas escaneadas.');
  }
  return out;
}
async function imagesToText(blobs,onProg){
  const s=await needSample();const lim=await imageLimits();
  if(!lim)throw{code:'unavailable',message:'Leer fotos necesita abrir Mnema desde claude.ai'};
  const per=Math.max(1,Math.min(lim.maxCount||1,4));let out='';
  for(let i=0;i<blobs.length;i+=per){
    onProg&&onProg(Math.min(i+per,blobs.length),blobs.length);
    const r=await s('Transcribe fielmente todo el texto de estas imágenes de apuntes o de un libro, en orden. Conserva títulos y listas. Si hay esquemas o tablas, pásalos a texto. Devuelve solo la transcripción, sin comentarios.',{images:blobs.slice(i,i+per),modelTier:'default'});
    out+=r.text+'\n\n';
  }
  return out;
}
function addMaterial(s,name,text){
  const MAX=100000;const parts=[];for(let i=0;i<text.length;i+=MAX)parts.push(text.slice(i,i+MAX));
  parts.forEach((p,i)=>{const m={id:rid(),subjectId:s.id,name:parts.length>1?name+' ('+(i+1)+'/'+parts.length+')':name,text:p,createdAt:Date.now()+i};S.materials[m.id]=m;Store.save('m',m)});
}

async function analyze(){
  const s=cur();if(!s||s.example)return;
  await withBusy('analyze',async()=>{
    const sm=await needSample();
    const ctx=contextFor(s,null,150000);
    const r=await sm.json(SYS+'\n\n<temario>\n'+ctx+'\n</temario>\n\nDivide este temario en sus temas o bloques principales, en el orden en que aparecen (entre 3 y 15; si el temario ya numera sus temas, respeta esa división). Responde solo con JSON con esta forma: {"temas":[{"titulo":"Título corto del tema","conceptos":["concepto 1","concepto 2"]}]} con entre 4 y 8 conceptos clave por tema.',{modelTier:'default'});
    const temas=(r&&r.temas)||[];
    if(!temas.length)throw{message:'No se encontraron temas en el material.'};
    const old=s.topics;
    s.topics=temas.slice(0,15).map(t=>{const prev=old.find(o=>norm(o.title)===norm(t.titulo));return prev?Object.assign(prev,{keyTerms:t.conceptos||prev.keyTerms}):{id:rid(),title:String(t.titulo||'Tema'),keyTerms:(t.conceptos||[]).map(String).slice(0,8),summary:'',read:false}});
    const ids=new Set(s.topics.map(t=>t.id));
    s.cards.forEach(c=>{if(!ids.has(c.topicId))c.topicId=s.topics[0].id});
    saveSubject(s);markActive();toast('Temario dividido en '+s.topics.length+' temas.');
  });
}

/* mapas, tablas y pódcast */
function wrap2(s,max){s=String(s||'');if(s.length<=max)return[s];let cut=s.lastIndexOf(' ',max);if(cut<max*0.5)cut=max;const a=s.slice(0,cut).trim();let b=s.slice(cut).trim();if(b.length>max)b=b.slice(0,max-1).trim()+'…';return[a,b]}
const BRC=['var(--spark)','var(--good)','var(--warn)','var(--bad)','var(--anil)','var(--spark-ink)','var(--ink-2)','var(--good)'];
function mindSvg(m){
  const ramas=(m.ramas||[]).slice(0,8).map((r,i)=>({n:String(r.nombre||''),h:(r.hijos||[]).slice(0,6).map(String),c:BRC[i%BRC.length]}));
  const right=[],left=[];ramas.forEach((r,i)=>(i%2===0?right:left).push(r));
  const rowH=44,gapB=14;
  const sideH=side=>side.length?side.reduce((n,r)=>n+Math.max(1,r.h.length)*rowH+gapB,0)-gapB:0;
  const H=Math.round(Math.max(sideH(right),sideH(left),120)+40);const W=1160,cx=580,cy=H/2;
  let out='';
  const draw=(side,dir)=>{
    let y=cy-sideH(side)/2;
    side.forEach(r=>{
      const rows=Math.max(1,r.h.length);const bh=rows*rowH;const by=y+bh/2;
      const bw=170,bx=dir>0?cx+110:cx-280;const inE=dir>0?bx:bx+bw,outE=dir>0?bx+bw:bx;const cE=dir>0?cx+90:cx-90;const mx=(cE+inE)/2;
      out+='<path d="M'+cE+' '+cy+' C '+mx+' '+cy+', '+mx+' '+by+', '+inE+' '+by+'" fill="none" stroke="'+r.c+'" stroke-width="3"/>';
      r.h.forEach((h,k)=>{
        const hy=y+k*rowH+rowH/2;const hw=240,hx=dir>0?cx+320:cx-560;const hE=dir>0?hx:hx+hw;const m2=(outE+hE)/2;
        out+='<path d="M'+outE+' '+by+' C '+m2+' '+by+', '+m2+' '+hy+', '+hE+' '+hy+'" fill="none" stroke="'+r.c+'" stroke-width="1.6" opacity=".75"/>';
        out+='<rect x="'+hx+'" y="'+(hy-18)+'" width="'+hw+'" height="36" rx="9" fill="var(--surface)" stroke="'+r.c+'" stroke-width="1.3"/>';
        const L=wrap2(h,34);
        out+=L.length===1?'<text x="'+(hx+12)+'" y="'+(hy+4.5)+'" font-size="13" fill="var(--ink)">'+esc(L[0])+'</text>':'<text x="'+(hx+12)+'" y="'+(hy-3)+'" font-size="12" fill="var(--ink)">'+esc(L[0])+'</text><text x="'+(hx+12)+'" y="'+(hy+11)+'" font-size="12" fill="var(--ink)">'+esc(L[1])+'</text>';
      });
      out+='<rect x="'+bx+'" y="'+(by-22)+'" width="'+bw+'" height="44" rx="12" fill="var(--surface-2)" stroke="'+r.c+'" stroke-width="2.5"/>';
      const B=wrap2(r.n,20);
      out+=B.length===1?'<text x="'+(bx+bw/2)+'" y="'+(by+5)+'" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">'+esc(B[0])+'</text>':'<text x="'+(bx+bw/2)+'" y="'+(by-3)+'" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">'+esc(B[0])+'</text><text x="'+(bx+bw/2)+'" y="'+(by+12)+'" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">'+esc(B[1])+'</text>';
      y+=bh+gapB;
    });
  };
  draw(right,1);draw(left,-1);
  const C=wrap2(m.centro||'',22);
  out+='<rect x="'+(cx-90)+'" y="'+(cy-30)+'" width="180" height="60" rx="16" fill="var(--anil)"/>';
  out+=C.length===1?'<text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" font-size="15" font-weight="700" fill="var(--surface)">'+esc(C[0])+'</text>':'<text x="'+cx+'" y="'+(cy-3)+'" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--surface)">'+esc(C[0])+'</text><text x="'+cx+'" y="'+(cy+13)+'" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--surface)">'+esc(C[1])+'</text>';
  return '<svg class="mind" viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Mapa mental: '+esc(m.centro)+'">'+out+'</svg>';
}

function voicesES(){const ss=window.speechSynthesis;if(!ss)return[];const vs=ss.getVoices()||[];const es=vs.filter(v=>/^es/i.test(v.lang));const es1=es.filter(v=>/es[-_]ES/i.test(v.lang));return es1.concat(es.filter(v=>!es1.includes(v)))}
function podSpeak(){
  const P=V.pod;if(!P)return;const t=cur().topics.find(x=>x.id===P.id);
  if(!t||!t.podcast){V.pod=null;return}
  if(P.i>=t.podcast.length){V.pod=null;markActive();toast('Pódcast terminado.');render();return}
  const l=t.podcast[P.i];const vs=voicesES();
  const u=new SpeechSynthesisUtterance(l.texto);u.lang='es-ES';u.rate=V.podRate||1;
  const isB=l.voz==='B';
  if(vs.length>1){u.voice=isB?vs[1]:vs[0]}else{if(vs[0])u.voice=vs[0];u.pitch=isB?0.78:1.15}
  const next=()=>{if(V.pod!==P||!P.playing)return;P.i++;podSpeak()};
  u.onend=next;u.onerror=e=>{if(e&&e.error==='interrupted'||e&&e.error==='canceled')return;next()};
  speechSynthesis.speak(u);highlightPod();

function similarity(a,b){
  const tok=x=>norm(x).split(/[^a-z0-9ñ]+/).filter(w=>w.length>2);
  const A=new Set(tok(a)),B=tok(b);if(!B.length)return 0;
  const Bs=new Set(B);let hit=0;Bs.forEach(w=>{if(A.has(w)||[...A].some(x=>x.length>4&&(x.startsWith(w.slice(0,5))||w.startsWith(x.slice(0,5)))))hit++});
  return hit/Bs.size;
}

function fmtSecs(x){x=Math.max(0,x);return x<60?x.toFixed(1).replace('.',',')+' s':Math.floor(x/60)+' min '+Math.round(x%60)+' s'}
function startMatch(){
  const s=cur();const f=V.cardTopic;
  const pool=s.cards.filter(c=>c.type!=='img'&&(f==='all'||c.topicId===f));
  const pick=pool.slice().sort(()=>Math.random()-0.5).slice(0,6);
  const tiles=[];pick.forEach(c=>{tiles.push({id:c.id,text:c.q});tiles.push({id:c.id,text:c.a})});
  tiles.sort(()=>Math.random()-0.5);
  clearInterval(V.gameTimer);
  V.game={tiles,sel:null,matched:0,n:pick.length,miss:0,start:Date.now(),done:false};
  V.gameTimer=setInterval(()=>{const G=V.game;if(!G||G.done){clearInterval(V.gameTimer);return}const el=$('#gClock');if(el)el.textContent=fmtSecs((Date.now()-G.start)/1000+G.miss*2)},100);
  render();
}
function tapTile(i){
  const G=V.game;if(!G||G.done)return;const x=G.tiles[i];if(x.gone)return;
  G.bad=null;
  if(G.sel===null){G.sel=i;render();return}
  if(G.sel===i){G.sel=null;render();return}
  const y=G.tiles[G.sel];
  if(y.id===x.id){x.gone=y.gone=true;G.sel=null;G.matched++;
    if(G.matched===G.n){G.done=true;clearInterval(V.gameTimer);G.time=(Date.now()-G.start)/1000+G.miss*2;const s=cur();G.record=!s.bestMatch||G.time<s.bestMatch;if(G.record){s.bestMatch=G.time;saveSubject(s)}markActive(G.n);pushScore(s,{match:G.time})}}
  else{G.miss++;G.bad=[G.sel,i];G.sel=null;setTimeout(()=>{if(V.game===G){G.bad=null;render()}},450)}
  render();
}

function shrinkImage(file,max){
  return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(u);cv.toBlob(b=>b?res(b):rej(new Error('imagen')),'image/jpeg',0.85)};img.onerror=()=>rej(new Error('imagen'));img.src=u});
}
let assetsP=null;

    if(A){const r=await A.upload(blob);return r.url}
  }
  const small=await shrinkImage(blob,900);
  const url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(small)});

}

async function startTest(opts={}){

  return (r&&r.correcciones)||null;

async function finishTest(){
  const T=V.test;if(!T||T.done)return;clearInterval(V.testTimer);
  const s=cur();
  const open=[];T.qs.forEach((q,i)=>{if((q.tipo==='corta'||q.tipo==='desarrollo')){const a=T.ans[i]||{text:''};if(!a.checked)open.push({i,q,text:a.text||''})}});
  if(open.length){
    T.grading=true;V.test.done=true;render();
    try{const res=await gradeOpenAnswers(open.filter(o=>o.text.trim()));let k=0;
      open.forEach(o=>{const a=T.ans[o.i]=T.ans[o.i]||{};a.checked=true;if(!o.text.trim()){a.score=0;a.verdict='Sin responder';return}const g=res&&res[k++];if(g){a.score=clamp(Number(g.nota)/10,0,1);a.verdict=g.veredicto;a.feedback=g.comentario}else{a.score=0;a.verdict='Sin corregir';a.feedback='No se pudo corregir automáticamente. Compara con la respuesta modelo.'}});
    }catch(e){toast(errMsg(e));open.forEach(o=>{const a=T.ans[o.i]=T.ans[o.i]||{};a.checked=true;a.score=a.score||0;a.verdict='Sin corregir'})}
    T.grading=false;
  }
  T.qs.forEach((q,i)=>{const a=T.ans[i]=T.ans[i]||{given:null,score:0,checked:true,verdict:'Sin responder'};if(!a.checked){a.checked=true;a.score=checkClosed(q,a.given)?1:0}});
  T.done=true;

  if(s.answers.length>400)s.answers=s.answers.slice(-400);
  s.tests=(s.tests||[]).concat([{label:T.label,date:today(),score,n:T.qs.length}]).slice(-30);
  saveSubject(s);markActive(T.qs.length);pushScore(s,{test:score});render();
}

  '<div class="panel stack"><div class="chat" id="chatBox" aria-live="polite">'+msgs+'</div><div class="quick">'+quick.map(q=>'<button type="button" data-act="quickAsk" data-q="'+esc(q)+'"'+(sending?' disabled':'')+'>'+esc(q)+'</button>').join('')+'</div>'+

}
async function sendChat(text){
  text=String(text||'').trim();if(!text||V.busy.tutor)return;
  const s=cur();const chat=chatOf(s.id);
  const t=V.tutorTopic!=='all'?s.topics.find(x=>x.id===V.tutorTopic):null;
  chat.push({role:'user',content:text});const reply={role:'assistant',content:''};chat.push(reply);
  V.busy.tutor=true;render();
  const mode=V.tutorMode==='explica'
    ?'Actúa como un profesor paciente: explica con claridad, con ejemplos y analogías, y comprueba al final con una pregunta breve si se ha entendido. Respuestas de 80 a 220 palabras salvo que pidan más.'
    :'Actúa como un tutor socrático: NO des la respuesta directamente. Haz una pregunta cada vez para que el estudiante razone; si responde, dile qué está bien y qué falta, y sigue con la siguiente pregunta. Si se atasca dos veces, dale una pista. Respuestas breves (máximo 120 palabras).';
  const intro=SYS+'\n\n<temario>\n'+contextFor(s,t,90000)+'\n</temario>\n\n'+(t?'El estudiante quiere centrarse en el tema «'+t.title+'».\n':'')+mode+' Cuando cites algo del temario, ponlo entre comillas. Puedes usar "## " para títulos, "- " para listas, **negrita** y ==término== para resaltar conceptos clave.';
  const turns=[{role:'user',content:intro}].concat(chat.slice(0,-1).slice(-16).map(m=>({role:m.role,content:m.content||'…'})));
  try{
    const sm=await needSample();
    const r=await sm(turns,{cache:false,modelTier:'default',onText:u=>{reply.content=u.text;const box=$('#chatBox');if(box&&V.tab==='tutor'){const last=box.lastElementChild;if(last)last.innerHTML=md(u.text);box.scrollTop=box.scrollHeight}}});
    reply.content=r.text;markActive();
  }catch(e){chat.pop();chat.pop();toast(errMsg(e));const inp=$('#chatIn');if(inp&&!inp.value)setTimeout(()=>{const i=$('#chatIn');if(i)i.value=text},0)}
  finally{delete V.busy.tutor;render();const i=$('#chatIn');if(i)i.focus()}
}

const CODE_CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newCode(){let c='';for(let i=0;i<6;i++)c+=CODE_CH[Math.floor(Math.random()*CODE_CH.length)];return c}
function snapshotFor(s){
  const snap={code:s.shareCode,name:s.name,examDate:s.examDate||null,owner:Store.uid,updatedAt:Date.now(),
    topics:s.topics.map(t=>({id:t.id,title:t.title,keyTerms:t.keyTerms||[],summary:t.summary||'',mindmap:t.mindmap||null,table:t.table||null,podcast:t.podcast||null})),
    cards:s.cards.filter(c=>c.type!=='img'||!String(c.img).startsWith('local:')).map(c=>{const o={id:c.orig||c.id,topicId:c.topicId,q:c.q,a:c.a,src:c.src||''};if(c.type==='img')Object.assign(o,{type:'img',img:c.img,rects:c.rects,ri:c.ri,mode:c.mode});return o})};
  const size=()=>JSON.stringify(snap).length;
  if(size()>240000)snap.topics.forEach(t=>t.podcast=null);
  if(size()>240000)snap.topics.forEach(t=>{t.table=null;t.mindmap=null});
  while(size()>240000&&snap.cards.length>50)snap.cards=snap.cards.slice(0,Math.floor(snap.cards.length*0.8));
  if(size()>250000)throw{message:'Esta asignatura es demasiado grande para compartirla entera.'};
  return snap;
}
function needCloud(){if(Store.mode!=='db'||!Store.db)throw{message:'Para compartir, abre Mnema desde claude.ai con tu cuenta.'}}
async function publishShare(s){
  needCloud();
  if(!s.shareCode){
    let code=newCode();
    for(let k=0;k<4;k++){const d=await Store.db.doc('shared/'+code).get();if(!d.exists)break;code=newCode()}
    s.shareCode=code;saveSubject(s);
  }
  await Store.db.doc('shared/'+s.shareCode).set(snapshotFor(s));
  s.sharedAt=Date.now();saveSubject(s);
}
async function joinCode(raw){
  needCloud();
  const code=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==6)throw{message:'El código tiene 6 letras o números.'};
  const mine=Object.values(S.subjects).find(x=>x.shareCode===code);
  if(mine){S.meta.activeId=mine.id;saveMeta();return mine}
  const d=await Store.db.doc('shared/'+code).get();
  if(!d.exists)throw{message:'No hay ningún grupo con ese código. Revisa que esté bien escrito.'};
  const v=JSON.parse(JSON.stringify(d.data()));const day=today();
  const s={id:rid(),name:String(v.name||'Asignatura compartida'),examDate:v.examDate||null,createdAt:Date.now(),shareCode:code,joined:true,
    topics:(v.topics||[]).map(t=>Object.assign({read:false},t)),
    cards:(v.cards||[]).map(c=>Object.assign({},c,{id:rid(),orig:c.id,ease:2.5,interval:0,reps:0,lapses:0,due:day})),answers:[],tests:[]};
  S.subjects[s.id]=s;S.meta.activeId=s.id;saveSubject(s);saveMeta();
  return s;
}
async function pullShare(s){
  needCloud();const d=await Store.db.doc('shared/'+s.shareCode).get();
  if(!d.exists)throw{message:'Este grupo ya no existe.'};
  const v=JSON.parse(JSON.stringify(d.data()));const day=today();let nT=0,nC=0;
  (v.topics||[]).forEach(t=>{const mine=s.topics.find(x=>x.id===t.id);if(mine){['summary','mindmap','table','podcast','keyTerms','title'].forEach(k=>{if(t[k]&&!mine[k])mine[k]=t[k]})}else{s.topics.push(Object.assign({read:false},t));nT++}});
  const have=new Set(s.cards.map(c=>c.orig||c.id));
  (v.cards||[]).forEach(c=>{if(!have.has(c.id)){s.cards.push(Object.assign({},c,{id:rid(),orig:c.id,ease:2.5,interval:0,reps:0,lapses:0,due:day}));nC++}});
  saveSubject(s);return{nT,nC};
}
async function pushScore(s,x){
  if(!s||!s.shareCode||Store.mode!=='db'||!Store.db)return;
  try{
    const ref=Store.db.doc('shared/'+s.shareCode+'/scores/'+Store.uid);const d=await ref.get();
    const o=d.exists?JSON.parse(JSON.stringify(d.data())):{best:null,match:null,tests:0};
    if(x.test!=null){o.best=Math.max(o.best||0,x.test);o.tests=(o.tests||0)+1}
    if(x.match!=null)o.match=o.match?Math.min(o.match,x.match):x.match;
    o.uid=Store.uid;o.updatedAt=Date.now();await ref.set(o);V.board=null;
  }catch(e){console.warn(e)}
}
async function loadBoard(code){
  if(V.boardLoading===code)return;V.boardLoading=code;
  try{
    const snap=await Store.db.collection('shared/'+code+'/scores').limit(200).get();
    const rows=snap.docs.map(d=>d.data()).filter(Boolean).map(x=>JSON.parse(JSON.stringify(x)));
    const names={};
    try{if(Store.user&&rows.length){const ps=await Store.user.profiles(rows.map(r=>r.uid));rows.forEach(r=>{names[r.uid]=(ps&&ps[r.uid]&&ps[r.uid].name)||''})}}catch(e){}
    V.board={code,rows,names};
  }catch(e){V.board={code,rows:[],names:{},err:true}}
  V.boardLoading=null;if(V.tab==='progreso')render();
}

  hlAdd:()=>{const m=curMat();if(m&&V.sel)addHl(m,V.sel,'')},
  hlNote:()=>{const m=curMat();if(m&&V.sel)noteModal(m,V.sel)},
  hlCard:()=>{const m=curMat();if(!m||!V.sel)return;const x=V.sel;addHl(m,x,'');cardModal(null,{a:x.text.length>300?x.text.slice(0,300)+'…':x.text,src:x.text.slice(0,160)})},
  hlOpen:b=>{const m=curMat();const h=m&&(m.hl||[]).find(x=>x.id===b.dataset.id);if(h)hlModal(m,h)},
  delMat:b=>{const id=b.dataset.id;delete S.materials[id];Store.remove('m',id);render()},
  analyze:()=>analyze(),
  toggleTopic:b=>{V.openTopic=V.openTopic===b.dataset.id?null:b.dataset.id;V.topicView='resumen';const t=cur().topics.find(x=>x.id===b.dataset.id);render();if(V.openTopic&&t&&!t.summary&&!cur().example)summarize(t.id)},
  tview:b=>{V.topicView=b.dataset.v;render()},
  genMap:b=>genTopicThing('map',b.dataset.id),
  genTable:b=>genTopicThing('tab',b.dataset.id),
  genPod:b=>genTopicThing('pod',b.dataset.id),
  podPlay:b=>{const ss=window.speechSynthesis;if(!ss){toast('Tu navegador no puede reproducir voz.');return}
    if(V.speaking){ss.cancel();V.speaking=null}
    if(V.pod&&V.pod.id===b.dataset.id){V.pod.playing=true}else{ss.cancel();V.pod={id:b.dataset.id,i:0,playing:true}}
    render();podSpeak()},
  podPause:()=>{if(V.pod){V.pod.playing=false;speechSynthesis.cancel()}render()},
  podStop:()=>{V.pod=null;try{speechSynthesis.cancel()}catch(e){}render()},
  summary:b=>summarize(b.dataset.id),
  markRead:b=>{const s=cur();const t=s.topics.find(x=>x.id===b.dataset.id);if(t){t.read=true;if(s.example)EXAMPLE=s;saveSubject(s);markActive();render()}},
  speak:b=>{
    const ss=window.speechSynthesis;if(!ss){toast('Tu navegador no puede leer en voz alta.');return}
    if(V.speaking===b.dataset.id){ss.cancel();V.speaking=null;render();return}
    const t=cur().topics.find(x=>x.id===b.dataset.id);V.pod=null;ss.cancel();
    const u=new SpeechSynthesisUtterance(t.summary.replace(/[#=*]/g,'').replace(/^- /gm,''));u.lang='es-ES';u.rate=1.02;
    const v=ss.getVoices().find(v=>v.lang==='es-ES')||ss.getVoices().find(v=>v.lang&&v.lang.startsWith('es'));if(v)u.voice=v;
    u.onend=()=>{V.speaking=null;if(V.tab==='temario')render()};V.speaking=t.id;ss.speak(u);render()},
  genCards:b=>genCards(b.dataset.id),
  testTopic:b=>{V.testCfg.topic=b.dataset.id;V.testCfg.mode='practica';V.test=null;V.tab='tests';render();window.scrollTo(0,0)},
  tutorTopic:b=>{V.tutorTopic=b.dataset.id;V.tab='tutor';render();window.scrollTo(0,0)},
  delTopic:b=>{const s=cur();const id=b.dataset.id;s.topics=s.topics.filter(t=>t.id!==id);s.cards=s.cards.filter(c=>c.topicId!==id);saveSubject(s);render()},
  cardView:b=>{V.cardView=b.dataset.v;if(b.dataset.v!=='juegos'){clearInterval(V.gameTimer);V.game=null}render()},
  addImgCard:()=>imgCardModal(),
  checkTyped:()=>{const R=V.review;if(!R)return;R.typed=($('#typeAns')||{}).value||'';R.show=true;render()},
  startMatch:()=>startMatch(),
  tile:b=>tapTile(+b.dataset.i),
  endGame:()=>{clearInterval(V.gameTimer);V.game=null;render()},
  startReview:b=>startReview(!!b.dataset.all),
  endReview:()=>{V.review=null;render()},
  showAns:()=>{if(V.review){V.review.show=true;render()}},
  grade:b=>{const s=cur();const R=V.review;const c=s.cards.find(x=>x.id===R.queue[0]);if(!c)return;const g=+b.dataset.g;gradeCard(c,g);R.queue.shift();if(g===0)R.queue.splice(Math.min(R.queue.length,3),0,c.id);R.done++;R.show=false;R.typed=null;saveSubject(s);markActive();render()},
  addCard:()=>cardModal(null),
  editCard:b=>cardModal(cur().cards.find(c=>c.id===b.dataset.id)),
  delCard:b=>{const s=cur();s.cards=s.cards.filter(c=>c.id!==b.dataset.id);saveSubject(s);render()},
  exportAnki:()=>exportAnki(),
  testMode:b=>{V.testCfg.mode=b.dataset.m;render()},
  startTest:()=>startTest(),
  startMissed:()=>startTest({missed:true,topic:'all'}),
  pick:b=>{const T=V.test;const i=+b.dataset.i;const q=T.qs[T.i];
    if(T.mode==='practica'){const ok=checkClosed(q,i);T.ans[T.i]={given:i,checked:true,score:ok?1:0}}else T.ans[T.i]={given:i};render()},
  gradeOpen:async()=>{const T=V.test;const q=T.qs[T.i];const text=($('#openAns')||{}).value||'';if(!text.trim()){toast('Escribe tu respuesta primero.');return}
    const sm=await getSample();T.ans[T.i]={text};
    if(!sm){T.ans[T.i]={text,checked:true,score:0,selfCheck:true,verdict:'Compara con la respuesta modelo'};render();return}
    await withBusy('grade',async()=>{try{const res=await gradeOpenAnswers([{q,text}]);const g=res&&res[0];T.ans[T.i]={text,checked:true,score:g?clamp(Number(g.nota)/10,0,1):0,verdict:g&&g.veredicto,feedback:g&&g.comentario}}catch(e){T.ans[T.i]={text,checked:true,score:0,selfCheck:true,verdict:'Compara con la respuesta modelo'};throw e}})},
  self:b=>{const T=V.test;const a=T.ans[T.i];a.score=+b.dataset.v;a.selfCheck=false;a.verdict=a.score>=0.75?'Te la sabías':a.score>=0.4?'A medias':'Para repasar';render()},
  nextQ:()=>{const T=V.test;saveOpen();T.i=Math.min(T.qs.length-1,T.i+1);render();window.scrollTo(0,0)},
  prevQ:()=>{const T=V.test;saveOpen();T.i=Math.max(0,T.i-1);render()},
  finishTest:()=>{saveOpen();finishTest()},
  quitTest:()=>{clearInterval(V.testTimer);V.test=null;render()},
  newTest:()=>{V.test=null;render()},
  failCards:()=>{const T=V.test;const s=cur();let n=0;
    T.qs.forEach((q,i)=>{if((T.ans[i].score||0)>=0.6)return;let a=q.tipo==='test'?q.opciones[Number(q.correcta)]:q.tipo==='vf'?((q.correcta===true||q.correcta==='true')?'Verdadero':'Falso')+'. '+(q.explicacion||''):String(q.correcta);
      s.cards.push({id:rid(),topicId:findTopicId(s,q.tema),q:q.pregunta,a,src:q.fuente||'',ease:2.5,interval:0,reps:0,lapses:0,due:today()});n++});
    saveSubject(s);toast(n+' tarjetas creadas con tus fallos.');V.test=null;V.tab='tarjetas';V.cardView='repaso';render()},
  tutMode:b=>{V.tutorMode=b.dataset.m;render()},
  quickAsk:b=>sendChat(b.dataset.q),
  clearChat:()=>{V.chats[cur().id]=[];render()}
};
function saveOpen(){const T=V.test;if(!T)return;const el=$('#openAns');if(el&&!el.disabled){T.ans[T.i]=Object.assign(T.ans[T.i]||{},{text:el.value})}}
document.addEventListener('click',e=>{
  const tab=e.target.closest('.tab');if(tab){V.tab=tab.dataset.tab;render();return}
  const mk=e.target.closest('#reader mark');
  if(mk){const sel=window.getSelection();if(!sel||sel.isCollapsed){const m=curMat();const h=m&&(m.hl||[]).find(x=>x.id===mk.dataset.h);if(h){hlModal(m,h);return}}}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  if($('#modal').contains(b))return;
  const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b,e)}
});
document.addEventListener('change',e=>{
  const el=e.target;const s=cur();
  if(el.id==='subjSel'){S.meta.activeId=el.value;V.review=null;V.test=null;V.openTopic=null;V.cardTopic='all';V.tutorTopic='all';saveMeta();render();return}
  if(el.id==='fileIn'){handleFiles(el.files);el.value='';return}
  if(!s)return;
  if(el.id==='examDate'){if(s.example){EXAMPLE.examDate=el.value||EXAMPLE.examDate}else{s.examDate=el.value||null;saveSubject(s)}render()}
  else if(el.id==='subjName'&&!s.example){s.name=el.value.trim()||s.name;saveSubject(s);render()}
  else if(el.id==='cardTopic'){V.cardTopic=el.value;V.review=null;render()}
  else if(el.id==='tTopic')V.testCfg.topic=el.value;
  else if(el.id==='tN')V.testCfg.n=+el.value;
  else if(el.id==='tMin')V.testCfg.min=clamp(+el.value||15,3,180);
  else if(el.dataset&&el.dataset.ty)V.testCfg.types[el.dataset.ty]=el.checked;
  else if(el.id==='tutTopic'){V.tutorTopic=el.value}
  else if(el.id==='podRate'){V.podRate=+el.value}
  else if(el.id==='typeMode'){S.meta.typeMode=el.checked;saveMeta()}
});
document.addEventListener('submit',e=>{if(e.target.id==='chatForm'){e.preventDefault();const i=$('#chatIn');const v=i.value;i.value='';sendChat(v)}});
document.addEventListener('keydown',e=>{if(e.target.id==='typeAns'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();ACT.checkTyped()}});
document.addEventListener('keydown',e=>{if(e.target.id==='chatIn'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#chatForm').requestSubmit()}});
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');if(ev==='drop')handleFiles(e.dataTransfer.files)}}));

/* ---------- arranque ---------- */
Store.loadLocal();
render();
Store.init();
})();
</script>
