function topicHeading(s,t){
  const i=s.topics.indexOf(t)+1;const x=String(t.title||'').trim();
  const m=x.match(/^tema\s*(\d+)\s*[·:.\-–—]?\s*(.*)$/i);
  return (m?'TEMA '+m[1]+(m[2]?': '+m[2]:''):'TEMA '+(i||1)+': '+x).toUpperCase();
}
function nRunsI(txt,f,out){
  const re=/\*\*\*([^*]+)\*\*\*|\*\*([^*]+)\*\*|==([^=]+)==|\+\+([^+]+)\+\+|!!([^!]+)!!|\*([^*\n]+)\*/g;let last=0,m;
  while((m=re.exec(txt))){
    if(m.index>last)out.push(Object.assign({},f,{text:txt.slice(last,m.index)}));
    const g=Object.assign({},f);let inner;
    if(m[1]!=null){g.b=1;g.i=1;inner=m[1]}else if(m[2]!=null){g.b=1;inner=m[2]}else if(m[3]!=null){g.hl=1;inner=m[3]}else if(m[4]!=null){g.u=1;inner=m[4]}else if(m[5]!=null){g.red=1;inner=m[5]}else{g.i=1;inner=m[6]}
    nRunsI(inner,g,out);last=m.index+m[0].length;
  }
  if(last<txt.length)out.push(Object.assign({},f,{text:txt.slice(last)}));
  return out;
}
function nRuns(txt,f){
  txt=String(txt||'');const out=[];
  const pre=txt.match(/^((?:Ejemplos?|Por ejemplo)\s*[:,])/i);
  if(pre){out.push(Object.assign({},f,{text:pre[1],red:1}));txt=txt.slice(pre[1].length)}
  return nRunsI(txt,f||{},out).filter(r=>r.text);
}
function headParts(text){const m=String(text).match(/^(\d+(?:\.\d+)*\.?)\s+(.*)$/);return m?[m[1].replace(/\.?$/,'.'),m[2]]:[null,String(text)]}
function parseNotes(src){
  const out=[];let stack=[];
  String(src||'').replace(/\r/g,'').split('\n').forEach(raw=>{
    if(!raw.trim())return;const l=raw.trim();let m;
    if((m=raw.match(/^(\s*)([-*•●▪◆➢]|\d+[.)]|[a-zA-Z][.)])\s+(.*)$/))&&!/^#/.test(l)){
      const ind=m[1].replace(/\t/g,'  ').length;
      while(stack.length&&stack[stack.length-1]>ind)stack.pop();
      if(!stack.length||stack[stack.length-1]<ind)stack.push(ind);
      const ord=!/^[-*•●▪◆➢]$/.test(m[2]);
      out.push({t:'li',lvl:Math.min(2,stack.length-1),ord,mark:ord?m[2].replace(')','.'):null,text:m[3]});return;
    }
    stack=[];
    if((m=l.match(/^(#{1,6})\s+(.*)/))){out.push({t:'h',lvl:Math.min(3,Math.max(1,m[1].length-1)),text:m[2]});return}
    if((m=l.match(/^>\s?(.*)/))){if(m[1].trim())out.push({t:'q',text:m[1]});return}
    if((m=l.match(/^:::\s*(.*)/))){out.push({t:'c',text:m[1]});return}
    out.push({t:'p',text:l});
  });
  return out;
}
function runsHtml(rs){return rs.map(r=>{let h=esc(r.text);if(r.b)h='<b>'+h+'</b>';if(r.i)h='<i>'+h+'</i>';if(r.u)h='<u>'+h+'</u>';if(r.hl)h='<mark>'+h+'</mark>';if(r.red)h='<span class="red">'+h+'</span>';return h}).join('')}
function notesHtml(src){
  let out='',lv=-1;const tags=[];
  const closeAll=()=>{while(lv>=0){out+='</li></'+tags.pop()+'>';lv--}};
  const olAttrs=mark=>{const k=String(mark||'1').replace('.','');return /^[A-Z]$/.test(k)?' type="A" start="'+(k.charCodeAt(0)-64)+'"':/^[a-z]$/.test(k)?' type="a" start="'+(k.charCodeAt(0)-96)+'"':' start="'+(parseInt(k,10)||1)+'"'};
  parseNotes(src).forEach(b=>{
    if(b.t!=='li'){closeAll()}
    if(b.t==='h'){const [n,txt]=headParts(b.text);out+='<h'+(b.lvl+1)+'>'+(n?'<span class="hn">'+esc(n)+'</span> ':'')+runsHtml(nRuns(txt))+'</h'+(b.lvl+1)+'>';return}
    if(b.t==='q'){out+='<blockquote>'+runsHtml(nRuns(b.text))+'</blockquote>';return}
    if(b.t==='c'){out+='<p class="c">'+runsHtml(nRuns(b.text))+'</p>';return}
    if(b.t==='p'){out+='<p>'+runsHtml(nRuns(b.text))+'</p>';return}
    const tg=b.ord?'ol':'ul';
    while(lv>b.lvl){out+='</li></'+tags.pop()+'>';lv--}
    if(lv===b.lvl){if(tags[lv]!==tg){out+='</li></'+tags.pop()+'>';lv--}else out+='</li>'}
    while(lv<b.lvl){out+='<'+tg+(b.ord?olAttrs(b.mark):'')+'>';tags.push(tg);lv++;if(lv<b.lvl)out+='<li class="nob">'}
    out+='<li>'+runsHtml(nRuns(b.text));
  });
  closeAll();return out;
}

  editNotes:b=>{V.editNotes=b.dataset.id;V.edDraft=null;render();const ed=$('#notesEd');if(ed){ed.focus();ed.closest('.topic').scrollIntoView({block:'start',behavior:'smooth'})}},
  cancelNotes:()=>{V.editNotes=null;V.edDraft=null;render()},
  saveNotes:b=>{const s=cur();const t=s.topics.find(x=>x.id===b.dataset.id);const ed=$('#notesEd');if(!t||!ed)return;
    const txt=htmlToNotes(ed);if(txt.length<5){toast('El documento está vacío.');return}
    t.notes=txt;t.notesEdited=Date.now();saveSubject(s);V.editNotes=null;V.edDraft=null;render();toast('Cambios guardados. El PDF y el Word ya los incluyen.')},
  redoNotes:b=>{const s=cur();const t=s.topics.find(x=>x.id===b.dataset.id);if(!t)return;
    if(!t.notesEdited){makeNotes(t.id);return}
    openModal('<h3>¿Rehacer el documento del tema?</h3><p class="muted" style="margin:0">Has editado este documento a mano. Si lo rehaces, Mnema lo vuelve a escribir desde tus archivos y se pierden tus cambios.</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" type="button" data-mact="cancel">Cancelar</button><button class="btn" type="button" data-mact="ok">Rehacer</button></div>',bx=>{
      bx.onclick=e=>{const a=e.target.closest('[data-mact]');if(!a)return;closeModal();if(a.dataset.mact==='ok'){t.notesEdited=null;makeNotes(t.id)}}})}
});

document.addEventListener('click',e=>{
  const tab=e.target.closest('.tab');if(tab){V.tab=tab.dataset.tab;if(V.tab==='temario')V.subjView='list';render();window.scrollTo(0,0);return}
  const mk=e.target.closest('#reader mark');
  if(mk){const sel=window.getSelection();if(!sel||sel.isCollapsed){const m=curMat();const h=m&&(m.hl||[]).find(x=>x.id===mk.dataset.h);if(h){hlModal(m,h);return}}}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  if($('#modal').contains(b))return;
  const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b,e)}
});
document.addEventListener('change',e=>{
  const el=e.target;const s=cur();
  if(onAccountChange(el))return;
  if((el.id==='subjSel'||el.id==='subjSel2')&&el.value==='__new'){render();ACT.newSubject();return}
  if(el.id==='subjSel'||el.id==='subjSel2'){S.meta.activeId=el.value;V.review=null;V.test=null;V.openTopic=null;saveMeta();render();return}
  if(el.id==='fileIn'){handleFiles(el.files);el.value='';return}
  if(el.id==='scopedIn'){const t=V.uploadTarget||{};V.uploadTarget=null;handleFiles(el.files,t);el.value='';return}
  if(el.id==='replaceIn'){const g=V.replaceGroup;V.replaceGroup=null;handleFiles(el.files,{replace:g});el.value='';return}
  if(!s)return;
  if(el.id==='examDate'){if(s.example){EXAMPLE.examDate=el.value||EXAMPLE.examDate}else{s.examDate=el.value||null;saveSubject(s)}render()}
  else if(el.id==='subjName'&&!s.example){s.name=el.value.trim()||s.name;saveSubject(s);render()}
  else if(el.id==='scopeOne'){scopeOf(s).one=el.value;V.review=null;V.game=null;render()}
  else if(el.id==='scopeBlock'){scopeOf(s).block=el.value;V.review=null;V.game=null;render()}
  else if(el.dataset&&el.dataset.scopeBlock!==undefined){const sc=scopeOf(s);const ids=topicsIn(s,el.dataset.scopeBlock||null).map(t=>t.id);sc.ids=sc.ids.filter(x=>!ids.includes(x));if(el.checked)sc.ids.push(...ids);V.review=null;V.game=null;render()}
  else if(el.dataset&&el.dataset.scope){const sc=scopeOf(s);const id=el.dataset.scope;sc.ids=sc.ids.filter(x=>x!==id);if(el.checked)sc.ids.push(id);V.review=null;V.game=null;render()}
  else if(el.id==='tN')V.testCfg.n=+el.value;
  else if(el.id==='tMin')V.testCfg.min=clamp(+el.value||15,3,180);
  else if(el.dataset&&el.dataset.ty)V.testCfg.types[el.dataset.ty]=el.checked;
  else if(el.id==='podRate'){V.podRate=+el.value;if(podAudio)podAudio.playbackRate=V.podRate}
  else if(el.id==='typeMode'){S.meta.typeMode=el.checked;saveMeta()}
});
document.addEventListener('submit',e=>{if(e.target.id==='chatForm'){e.preventDefault();const i=$('#chatIn');const v=i.value;i.value='';sendChat(v)}});
document.addEventListener('keydown',e=>{if(e.target.id==='typeAns'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();ACT.checkTyped()}});
document.addEventListener('keydown',e=>{if(e.target.id==='chatIn'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#chatForm').requestSubmit()}});
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');if(ev==='drop')handleFiles(e.dataTransfer.files)}}));

/* ---------- recargar conservando la posición ---------- */
const RESTORE_KEY='mnema.restore';
function placeSnapshot(){
  const s=cur();
  return {t:Date.now(),tab:V.tab,subj:s&&s.id,subjView:V.subjView,openTopic:V.openTopic,topicView:V.topicView,readMat:V.readMat,cardView:V.cardView,acctTab:V.acctTab,manSec:V.manSec,manQ:V.manQ,
    adm:V.adm?{tab:V.adm.tab,filter:V.adm.filter,q:V.adm.q,msg:V.adm.msg}:null,scopes:V.scopes||null,testCfg:V.testCfg,tutorMode:V.tutorMode,y:window.scrollY||0};
}
function placeSnapshotWithNav(){const p=placeSnapshot();p.nav=V.navStack.slice(-30);return p
}
async function reloadApp(){
  document.querySelectorAll('.reload-btn').forEach(b=>{b.disabled=true;b.classList.add('busy')});
  try{sessionStorage.setItem(RESTORE_KEY,JSON.stringify(placeSnapshotWithNav()))}catch(e){}
  try{await Promise.race([Store.flush(),pause(4000)])}catch(e){}
  try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.update().catch(()=>{})))}}catch(e){}
  try{if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}
  location.reload();
}
function readRestore(){let r=null;try{r=JSON.parse(sessionStorage.getItem(RESTORE_KEY)||'null');sessionStorage.removeItem(RESTORE_KEY)}catch(e){}return r&&Date.now()-r.t<120000?r:null}
function applyRestore(r){
  if(!r)return;
  ['tab','subjView','openTopic','topicView','readMat','cardView','acctTab','manSec','manQ','tutorMode'].forEach(k=>{if(r[k]!==undefined&&r[k]!==null)V[k]=r[k]});
  if(r.adm&&V.adm)Object.assign(V.adm,r.adm);
  if(r.scopes)V.scopes=r.scopes;
  if(r.testCfg)V.testCfg=Object.assign(V.testCfg,r.testCfg);
  if(r.subj&&(S.subjects[r.subj]||r.subj==='ejemplo'))S.meta.activeId=r.subj;
}
function restoreScroll(r){if(r&&r.y)requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo(0,r.y)))}

/* ---------- arranque ---------- */
Store.loadLocal();
try{applyTheme(localStorage.getItem('mnema.theme')||S.meta.theme||'system',true)}catch(e){applyTheme(S.meta.theme||'system',true)}
V.podRate=S.meta.podRate||1;setPomo('foco');
try{const qt=new URLSearchParams(location.search).get('tab');if(qt==='asignaturas')V.tab='temario';else if(['hoy','temario','tarjetas','tests','tutor','progreso','cuenta'].includes(qt))V.tab=qt}catch(e){}
document.addEventListener('mnema-install-change',()=>{if(V.tab==='cuenta')render()});
const RESTORE=readRestore();
V._noNav=true;
applyRestore(RESTORE);
if(RESTORE&&Array.isArray(RESTORE.nav))V.navStack=RESTORE.nav;
render();
const meReady=window.mnemaAccount?window.mnemaAccount.get().then(u=>{V.me=u||null}).catch(()=>{}):Promise.resolve();
Promise.all([Store.init(),meReady]).then(()=>{if(S.meta.theme)applyTheme(S.meta.theme,true);applyRestore(RESTORE);render();V._noNav=false;restoreScroll(RESTORE)}).catch(()=>{V._noNav=false});
})();
</script>
