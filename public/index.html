<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Mnema: sube tu temario y estudia con resúmenes, mapas mentales, pódcast, tarjetas, tests corregidos y tutor.">
<meta name="theme-color" content="#1F2C86">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mnema">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}.booting .shell{visibility:hidden}</style><script>document.documentElement.classList.add("booting");setTimeout(function(){document.documentElement.classList.remove("booting")},4000)</script>
<title>Mnema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: app shell — brand bar + sticky tab rail, one working column (max 1080px) per tab */
:root{
  --bg:#F4F6FC; --surface:#FFFFFF; --surface-2:#EAEFFA; --line:#D7DEF0;
  --ink:#131A4A; --ink-2:#4B5479; --ink-3:#6A7396;
  --anil:#1F2C86; --spark:#4A7DFF; --spark-ink:#2C55D6; --spark-soft:#DCE6FF;
  --btn-bg:#1F2C86; --btn-ink:#FFFFFF;
  --good:#17824F; --good-soft:#DDF3E8; --warn:#9A6400; --warn-soft:#FCEFD6; --bad:#B93A33; --bad-soft:#FBE3E1;
  --shadow:0 1px 2px rgba(19,26,74,.05),0 8px 24px rgba(19,26,74,.07);
  --side:#1F2C86; --side-ink:#FFFFFF; --hero:#1F2C86;
  --f-display:'Unbounded','DM Sans',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#111114; --surface-2:#1B1B21; --line:#2B2B34;
  --ink:#F5F6FA; --ink-2:#C9CCD8; --ink-3:#9DA1B2;
  --anil:#B4C8FF; --spark:#86A9FF; --spark-ink:#AFC5FF; --spark-soft:#19213F;
  --btn-bg:#86A9FF; --btn-ink:#050B24;
  --good:#6FE0A8; --good-soft:#0F2A20; --warn:#F5C86A; --warn-soft:#2B2210; --bad:#FF8F86; --bad-soft:#33141A;
  --side:#0A0A0D; --side-ink:#FFFFFF; --hero:#1A2252;
  --shadow:0 1px 2px rgba(0,0,0,.6),0 10px 28px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#111114; --surface-2:#1B1B21; --line:#2B2B34;
  --ink:#F5F6FA; --ink-2:#C9CCD8; --ink-3:#9DA1B2;
  --anil:#B4C8FF; --spark:#86A9FF; --spark-ink:#AFC5FF; --spark-soft:#19213F;
  --btn-bg:#86A9FF; --btn-ink:#050B24;
  --good:#6FE0A8; --good-soft:#0F2A20; --warn:#F5C86A; --warn-soft:#2B2210; --bad:#FF8F86; --bad-soft:#33141A;
  --side:#0A0A0D; --side-ink:#FFFFFF; --hero:#1A2252;
  --shadow:0 1px 2px rgba(0,0,0,.6),0 10px 28px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--spark);outline-offset:2px;border-radius:6px}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand .word{font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:-.5px}
.brand svg .ln{stroke:var(--anil)} .brand svg .nd{fill:var(--anil)} .brand svg .hub{fill:var(--spark)}
.subj{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.subj select{max-width:260px;min-width:0}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:0 0}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:10px 14px 12px;font-weight:500;color:var(--ink-2);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;border-radius:0}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--spark)}

main{padding-block:24px 64px}
h1,h2,h3{margin:0;text-wrap:balance}
h2.sec{font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:-.3px}
h3{font-size:16px;font-weight:700}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.panel.flat{background:var(--surface-2);border-color:transparent}

select,input[type=text],input[type=date],input[type=number],input[type=email],input[type=password],input[type=search],textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:40px;max-width:100%}
textarea{width:100%;resize:vertical;min-height:90px;line-height:1.5}
label.lbl{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2);font-weight:500}
.btn{appearance:none;border:1px solid transparent;background:var(--btn-bg);color:var(--btn-ink);padding:9px 16px;border-radius:10px;font-weight:500;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.soft{background:var(--spark-soft);color:var(--spark-ink)}
.btn.small{min-height:34px;padding:6px 12px;font-size:14px}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.spark{background:var(--spark-soft);color:var(--spark-ink)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--spark)}
.bar.good > i{background:var(--good)} .bar.warn > i{background:var(--warn)} .bar.bad > i{background:var(--bad)}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:2s}}

/* Hoy */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.count{font-family:var(--f-display);font-weight:600;font-size:44px;line-height:1;letter-spacing:-1px;color:var(--anil)}
.plan-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plan-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.plan-item .dot{width:10px;height:10px;border-radius:50%;background:var(--spark);flex-shrink:0}
.plan-item.done .dot{background:var(--good)}
.plan-item .txt{flex:1;min-width:0}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{background:var(--surface-2);border-radius:10px;padding:8px 6px;min-height:86px;font-size:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.day b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.day .t{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;color:var(--ink)}
.day.today{background:var(--spark-soft)}
.day.exam{background:var(--anil);color:var(--surface)} .day.exam b,.day.exam .t{color:var(--surface)}
@media (max-width:560px){.week{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pomo{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.pomo .clock{font-family:var(--f-mono);font-size:52px;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
.ring{position:relative;width:180px;height:180px;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

/* Temario */
.drop{border:2px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--spark);background:var(--spark-soft)}
.mat{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.mat:first-child{border-top:0}
.mat .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.topic{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.topic-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px}
.topic-h .idx{font-family:var(--f-mono);color:var(--ink-3);font-size:13px;width:26px}
.topic-h .tt{font-weight:700;min-width:0}
.topic-h .kt{font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topic-acts{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 14px 54px}
@media (max-width:560px){.topic-acts{padding-left:16px}}
.topic-body{border-top:1px solid var(--line);padding:18px 20px 20px 54px;background:var(--surface)}
@media (max-width:560px){.topic-body{padding-left:20px}}
.md{max-width:68ch}
.md h4{font-size:15px;margin:18px 0 6px;font-weight:700}
.md p{margin:0 0 10px}
.md ul{margin:0 0 10px;padding-left:20px}
.md li{margin:3px 0}
mark{background:var(--spark-soft);color:var(--ink);padding:0 3px;border-radius:4px;box-shadow:inset 0 -2px 0 var(--spark)}
.status{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--spark-soft);color:var(--spark-ink);font-weight:500;font-size:14px}
.status.err{background:var(--bad-soft);color:var(--bad)}

/* Tarjetas */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat .v{font-family:var(--f-mono);font-size:26px;line-height:1.1;color:var(--ink)}
.stat .k{font-size:12.5px;color:var(--ink-3)}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:28px 24px;min-height:260px;display:flex;flex-direction:column;gap:14px;max-width:680px;margin:0 auto;width:100%}
.flash .q{font-size:21px;font-weight:500;line-height:1.35;text-wrap:balance}
.flash .a{font-size:17px;border-top:1px dashed var(--line);padding-top:14px}
.flash .src{font-size:13px;color:var(--ink-3);font-style:italic}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:680px;margin:0 auto;width:100%}
.grades .btn{flex-direction:column;gap:0;padding:8px 6px;min-height:52px}
.grades .btn small{font-family:var(--f-mono);font-size:11.5px;opacity:.8;font-weight:400}
.g0{background:var(--bad-soft);color:var(--bad)} .g1{background:var(--warn-soft);color:var(--warn)} .g2{background:var(--spark-soft);color:var(--spark-ink)} .g3{background:var(--good-soft);color:var(--good)}
.clist{display:flex;flex-direction:column}
.crow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:start;font-size:14px}
@media (max-width:620px){.crow{grid-template-columns:minmax(0,1fr) auto}.crow .ca{grid-column:1/2}}

/* Tests */
.qcard{max-width:720px;margin:0 auto;width:100%}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{appearance:none;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--spark)}
.opt .l{font-family:var(--f-mono);color:var(--ink-3);flex-shrink:0}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ko{border-color:var(--bad);background:var(--bad-soft)}
.opt.pick{border-color:var(--spark);background:var(--spark-soft)}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:12px 14px;font-size:14.5px}
.fb.ok{background:var(--good-soft)} .fb.ko{background:var(--bad-soft)} .fb.mid{background:var(--warn-soft)}
.fb b{display:block;margin-bottom:2px}
.progress-line{display:flex;align-items:center;gap:12px}
.progress-line .bar{flex:1}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.check{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface);min-height:40px}
.check input{accent-color:var(--spark);width:16px;height:16px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{appearance:none;border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:500;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.res{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.res .ic{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:2px}
.ic.ok{background:var(--good-soft);color:var(--good)} .ic.ko{background:var(--bad-soft);color:var(--bad)} .ic.mid{background:var(--warn-soft);color:var(--warn)}

/* Tutor */
.chat{display:flex;flex-direction:column;gap:12px;min-height:280px;max-height:min(60vh,620px);overflow-y:auto;padding:4px 2px}
.msg{max-width:min(78ch,88%);padding:12px 14px;border-radius:14px;line-height:1.55;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--btn-bg);color:var(--btn-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.msg.ai .md{max-width:none}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:48px;max-height:160px;flex:1}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;color:var(--ink-2);min-height:34px}
.quick button:hover{border-color:var(--spark);color:var(--ink)}

/* Progreso */
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(80px,220px) 48px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.mrow:first-child{border-top:0}
.mrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:320px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--surface-2);display:block;max-width:100%}
.heat i.l1{background:color-mix(in srgb,var(--spark) 30%,var(--surface-2))}
.heat i.l2{background:color-mix(in srgb,var(--spark) 60%,var(--surface-2))}
.heat i.l3{background:var(--spark)}
.heat i.t{outline:2px solid var(--anil);outline-offset:1px}

.empty{text-align:center;padding:36px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty p{max-width:46ch;margin:0}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--surface-2);font-size:14px}
.banner .t{flex:1;min-width:200px}

.modal{position:fixed;inset:0;z-index:30;background:rgba(10,16,53,.5);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .box{background:var(--surface);border-radius:18px;padding:22px;width:min(520px,100%);max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.foot{font-size:12.5px;color:var(--ink-3);text-align:center;padding-block:8px 0}
/* Mi cuenta */
.avatar{appearance:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--spark-soft);color:var(--spark-ink);font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;padding:0;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar[aria-current="page"]{border-color:var(--spark)}
.avatar.big{width:88px;height:88px;font-size:32px;cursor:default;border-width:3px}
.acct-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.acct-nav{display:flex;gap:6px;flex-wrap:wrap}
.acct-nav a{color:var(--ink-2);text-decoration:none;font-size:14px;padding:6px 12px;border-radius:999px;background:var(--surface-2)}
.acct-nav a:hover{color:var(--ink)}
.form2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.form2 input{width:100%}
.srow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(130px,.8fr) auto;gap:10px;align-items:end;padding:12px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
@media (max-width:640px){.srow{grid-template-columns:minmax(0,1fr)}}
.manual details{border-top:1px solid var(--line);padding:4px 0}
.manual details:first-child{border-top:0}
.manual summary{cursor:pointer;font-weight:700;padding:10px 0;list-style-position:outside}
.manual summary::marker{color:var(--spark)}
.manual .md{padding:0 0 10px 2px}
.danger-zone{border-color:var(--bad-soft)}
.shortcuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.shortcuts .btn{justify-content:flex-start;min-height:48px}
/* Presentación (versión con cuentas) */

.land{display:flex;flex-direction:column}
.land-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.land-top .in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}

/* Vistas del tema */

/* Lector */

.board{display:flex;flex-direction:column}

/* ===== Diseño: barra lateral (ordenador) + barra inferior (móvil) ===== */
body::before{display:none}

.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:22px;padding:24px 16px 20px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));overflow-y:auto}

.side .tab .ni{flex-shrink:0;opacity:.95}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;border-top:1px solid rgba(255,255,255,.14);padding-top:14px}

.content{min-width:0;display:flex;flex-direction:column}
.side{border-right:1px solid var(--line)}
/* Sin zoom en el móvil: sin doble toque y sin zoom automático al escribir */

@media (max-width:899px),(pointer:coarse){input,select,textarea{font-size:16px!important}}

  .mtop .side-brand{padding:0}

  .mtop .subj-sel option{color:#131A4A;background:#fff}

  main > .stack, main .page{gap:20px}

}

.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}

.msg-card{border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}

.man-card > span:not(.man-ic):not(.man-go){color:var(--ink-2);font-size:14.5px}
.man-go{margin-top:auto;color:var(--spark-ink);font-weight:600;font-size:14px;padding-top:6px}
.man-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--c)}
.man-ic.big{width:64px;height:64px;border-radius:18px}
.man-art{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:22px;box-shadow:var(--shadow);border-top:6px solid var(--c)}
.man-art-h{display:flex;gap:16px;align-items:center}
.man-art-h h2{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,3vw,28px);letter-spacing:-.4px}
.man-art-h p{margin:4px 0 0;color:var(--ink-2)}
.man-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:ms}
.man-steps li{counter-increment:ms;display:grid;grid-template-columns:36px minmax(0,1fr);gap:14px;align-items:start;font-size:16px;line-height:1.55}
.man-steps li::before{content:counter(ms);width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-family:var(--f-mono)}
.man-steps li span{padding-top:6px}
.man-items{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.man-item{background:var(--surface-2);border-radius:16px;padding:16px 18px}
.man-item b{display:block;margin-bottom:4px;font-size:15.5px}
.man-item p{margin:0;color:var(--ink-2);font-size:14.5px}
.man-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (max-width:560px){.man-hero,.man-art{padding:20px;border-radius:20px}}

/* Bloques dentro de una asignatura */
.block{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:22px;background:var(--surface-2)}
.bhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bhead-t{appearance:none;border:0;background:none;font:inherit;color:var(--ink);display:flex;align-items:center;gap:12px;cursor:pointer;padding:2px;text-align:left;flex:1;min-width:200px}
.bnum{width:40px;height:40px;border-radius:12px;background:var(--btn-bg);color:var(--btn-ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:14px;flex-shrink:0}
.btitle{display:flex;flex-direction:column;min-width:0}
.btitle b{font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.btitle small{color:var(--ink-3);font-size:13px}
.bhead-t .chev{color:var(--ink-3);transition:transform .15s;flex-shrink:0}
.bhead-t .chev.open{transform:rotate(90deg)}
.bbar{width:120px;display:flex}
.bbar .bar{flex:1}
@media (max-width:640px){.bbar{display:none}.block{padding:12px;border-radius:18px}}
.block .topic{background:var(--surface)}
.scgrp{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:14px;background:var(--surface-2)}
.bcheck{background:transparent!important;border:0!important;padding:2px 0!important}
.wrapseg{flex-wrap:wrap}

/* Botón de recargar */
.reload-btn{appearance:none;border:0;background:none;font:inherit;cursor:pointer;color:inherit;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-weight:500;font-size:15px;min-height:44px;width:100%;text-align:left}
.side .reload-btn{color:rgba(255,255,255,.82)}
.side .reload-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.reload-btn.mini{width:40px;height:40px;padding:0;justify-content:center;color:#fff;flex-shrink:0}
.reload-btn.busy svg{animation:sp .8s linear infinite}
.reload-btn:disabled{cursor:default;opacity:.8}
@media (prefers-reduced-motion: reduce){.reload-btn.busy svg{animation-duration:2.4s}}

/* Estructura vacía */
.struct-empty{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:24px;align-items:center;background:var(--surface);border:1px dashed var(--line);border-radius:22px;padding:24px}
@media (max-width:700px){.struct-empty{grid-template-columns:minmax(0,1fr);padding:18px}}
.struct-demo{display:flex;flex-direction:column;gap:8px;align-items:center}
.sd-subj{background:var(--btn-bg);color:var(--btn-ink);border-radius:12px;padding:8px 14px;font-weight:700;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd-row{display:flex;gap:10px}
.sd-block{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:100px}
.sd-block b{font-size:13px}
.sd-block span{font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 8px;color:var(--ink-2)}

/* Herramientas */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
.fcard{appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px;transition:border-color .12s,transform .12s}
.fcard:hover{border-color:var(--c);transform:translateY(-2px)}
@media (prefers-reduced-motion: reduce){.fcard{transition:none}.fcard:hover{transform:none}}
.fcard b{font-size:16px}
.fcard > span:last-child{color:var(--ink-2);font-size:14px;line-height:1.45}
.fic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--c)}
.ttools{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 12px 58px}
@media (max-width:560px){.ttools{padding-left:16px;padding-right:16px}}
.ttb{appearance:none;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;font-weight:500;min-height:38px}
.ttb svg{color:var(--spark-ink)}
.ttb:hover{border-color:var(--spark)}
.ttb.on{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg)}
.ttb.on svg{color:var(--btn-ink)}
.ttb:disabled{opacity:.6;cursor:default}
.topic-acts:empty{display:none}
.nlist{display:flex;flex-direction:column}
.nrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.nrow:first-child{border-top:0}
.nic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--spark-soft);color:var(--spark-ink)}
.nname{display:flex;flex-direction:column;min-width:0}
.nname b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nname small{color:var(--ink-3);font-size:13px}
@media (max-width:560px){.nrow{grid-template-columns:36px minmax(0,1fr)}.nrow > .row{grid-column:2}}
.notes-doc .md{max-width:72ch;font-size:15.5px;line-height:1.65}
.notes-doc h4{font-size:17px;margin-top:22px}

/* Volver atrás */
.navrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:-8px}
.navrow:empty{display:none}
.backbtn{appearance:none;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:7px 14px 7px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14.5px;min-height:40px}
.backbtn:hover{border-color:var(--spark);color:var(--spark-ink)}
.navrow .crumb{margin:0}
.crumb > span:last-child{color:var(--ink-2);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40ch}
.mback{appearance:none;border:0;background:rgba(255,255,255,.14);color:#fff;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex-shrink:0;padding:0}
.mback:not([hidden]) + .side-brand{display:none}

/* Archivos del tema y biblioteca */
.tdrop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 20px 12px 58px;padding:14px 16px;border:2px dashed var(--line);border-radius:16px;background:var(--surface-2);color:var(--spark-ink)}
.tdrop > span:nth-child(2){display:flex;flex-direction:column;flex:1;min-width:180px;color:var(--ink)}
.tdrop small{color:var(--ink-3);font-size:13px}
.tdrop.over,.tfiles.over{border-color:var(--spark);background:var(--spark-soft)}
.tfiles{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 20px 12px 58px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface-2)}
.tpdf{width:40px;height:48px;border-radius:8px;background:#E5484D;color:#fff;font-weight:800;font-size:11px;display:grid;place-items:center;letter-spacing:.5px;flex-shrink:0;box-shadow:inset 0 -10px 0 rgba(0,0,0,.12)}
.tf-txt{display:flex;flex-direction:column;flex:1;min-width:180px}
.tf-txt small{color:var(--ink-3);font-size:13px}
.linkbtn{appearance:none;border:0;background:none;padding:0;font:inherit;color:var(--spark-ink);text-decoration:underline;cursor:pointer}
@media (max-width:560px){.tdrop,.tfiles{margin-left:16px;margin-right:16px}}
.lsec{display:flex;flex-direction:column;gap:2px}
.lsec-h{margin-bottom:8px}
.lsec-h h3{margin-top:2px}
.lrow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.lsec-h + .lrow{border-top:0}
.lic{width:48px;height:56px;border-radius:9px;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;background:#64748B;letter-spacing:.3px}
.lic.pdf{background:#E5484D}.lic.word{background:#2B6CE4}.lic.foto{background:#17A673}.lic.texto{background:#64748B}
.lname{display:flex;flex-direction:column;min-width:0}
.lname b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lname small{color:var(--ink-3);font-size:13px}
.lacts{justify-content:flex-end}
.lmove{min-height:34px;padding:5px 8px;font-size:14px;max-width:160px}
@media (max-width:760px){.lrow{grid-template-columns:48px minmax(0,1fr)}.lacts{grid-column:1/-1;justify-content:flex-start}}

/* Documento del tema (formato apuntes) */
.paper{background:#fff;color:#000;font-family:'Times New Roman',Tinos,'Liberation Serif',Times,serif;font-size:15.5px;line-height:1.42;padding:30px 44px 40px;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.12),0 10px 30px rgba(19,26,74,.10);max-width:820px;text-align:justify;border:1px solid #E3E6EF}
.paper .ph{text-align:right;font-size:10px;letter-spacing:.3px;color:#222;margin-bottom:26px}
.paper h1.ttl{font-family:inherit;font-size:17px;font-weight:700;text-align:center;margin:0 6% 22px;line-height:1.3;color:#000;letter-spacing:0}
.paper h2,.paper h3,.paper h4{font-family:inherit;color:#000;font-weight:700;text-align:left;letter-spacing:0;line-height:1.3}
.paper h2{font-size:16px;margin:24px 0 10px;padding-left:18px}
.paper h3{font-size:15.5px;margin:18px 0 8px;padding-left:44px}
.paper h4{font-size:15.5px;margin:14px 0 8px;padding-left:68px}
.paper .hn{display:inline-block;min-width:2.6em}
.paper p{margin:0 0 10px}
.paper p.c{text-align:center;font-weight:700}
.paper blockquote{font-style:italic;margin:0 34px 12px;padding:0;border:0}
.paper ul,.paper ol{margin:0 0 10px;padding-left:44px}
.paper ul ul,.paper ol ol,.paper ul ol,.paper ol ul{margin:2px 0 4px;padding-left:30px}
.paper ul{list-style:none}
.paper ul>li{position:relative}
.paper ul>li::before{content:'-';position:absolute;left:-18px}
.paper ul ul>li::before{content:'\25CF';font-size:.75em;top:.2em}
.paper ul ul ul>li::before{content:'\25AA';font-size:1em;top:0}
.paper li{margin:0 0 4px}
.paper li.nob::before{content:none}
.paper mark{background:#FFF200;color:#000}
.paper .red{color:#E00000}
.paper u{text-underline-offset:2px}
.paper #notesEd{outline:none;min-height:240px}
.paper #notesEd:focus{box-shadow:none}
.notes-doc .paper{margin:0 auto}
.edbar{position:sticky;top:8px;z-index:5;display:flex;flex-wrap:wrap;gap:6px;padding:8px;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}

@media (max-width:560px){.paper{padding:20px 18px 26px;font-size:14.5px;text-align:left}.paper h2{padding-left:0}.paper h3{padding-left:16px}.paper h4{padding-left:30px}.paper blockquote{margin:0 14px 12px}.paper ul,.paper ol{padding-left:28px}.edbar{top:62px}.edg{border-right:0;padding-right:0}}

const EX_TEXT=`TEMA 1. LA TEORÍA CELULAR
La teoría celular afirma que todos los seres vivos están formados por una o más células, que la célula es la unidad estructural y funcional de los seres vivos y que toda célula procede de otra célula preexistente. Robert Hooke observó en 1665 celdillas en una lámina de corcho y las llamó células. Schleiden (1838) y Schwann (1839) propusieron que plantas y animales están formados por células. Virchow (1855) añadió el principio "omnis cellula e cellula": toda célula procede de otra célula.

TEMA 2. CÉLULA PROCARIOTA Y EUCARIOTA
Las células procariotas no tienen núcleo: su material genético (ADN circular) está en una región llamada nucleoide. Son más pequeñas (1-10 µm), carecen de orgánulos membranosos y tienen ribosomas 70S. Las bacterias son procariotas. Las células eucariotas tienen un núcleo rodeado por una envoltura nuclear, son mayores (10-100 µm), poseen orgánulos membranosos y ribosomas 80S. Animales, plantas, hongos y protoctistas son eucariotas. La célula vegetal tiene pared celular de celulosa, cloroplastos y una gran vacuola; la animal tiene centriolos y carece de pared celular.

TEMA 3. ORGÁNULOS CELULARES
Las mitocondrias realizan la respiración celular y producen energía en forma de ATP; tienen doble membrana y ADN propio. Los cloroplastos, presentes en células vegetales, realizan la fotosíntesis gracias a la clorofila. El retículo endoplasmático rugoso tiene ribosomas adheridos y participa en la síntesis de proteínas; el liso sintetiza lípidos. El aparato de Golgi modifica, empaqueta y distribuye las proteínas en vesículas. Los lisosomas contienen enzimas digestivas y realizan la digestión celular.`;

const LS_KEY='mnema.v1';
const Store={
  mode:'local',db:null,uid:null,timers:{},chains:{},
  loadLocal(){
    try{const raw=localStorage.getItem(LS_KEY);if(!raw)return;const d=JSON.parse(raw);
      Object.assign(S.subjects,d.subjects||{});Object.assign(S.materials,d.materials||{});Object.assign(S.images,d.images||{});if(d.meta)S.meta=Object.assign(S.meta,d.meta);}catch(e){}
  },
  saveLocal(){
    clearTimeout(this.timers.__local);
    this.timers.__local=setTimeout(()=>{try{localStorage.setItem(LS_KEY,JSON.stringify({subjects:S.subjects,materials:S.materials,images:S.images,meta:S.meta}))}catch(e){
      toast('No se pudo guardar en este navegador: el temario es demasiado grande. Entra con tu cuenta para guardarlo en la nube.')}},500);
  },
  path(){return 'data/users/'+this.uid},
  async init(){
    const C=window.claude; if(!C||!C.use) return;
    let db=null,user=null;
    try{[db,user]=await Promise.all([C.use('db'),C.use('user')])}catch(e){}
    if(!db||!user) return;
    let id=null; try{id=await user.id()}catch(e){}
    if(!id) return;
    this.db=db;this.uid=id;this.user=user;
    try{
      const snap=await db.collection(this.path()).limit(1000).get();
      const remote={subjects:{},materials:{},images:{},meta:null};
      for(const d of snap.docs){const v=d.data();if(!v)continue;
        if(d.id==='meta')remote.meta=v;else if(d.id.startsWith('s_'))remote.subjects[v.id]=JSON.parse(JSON.stringify(v));else if(d.id.startsWith('m_'))remote.materials[v.id]=JSON.parse(JSON.stringify(v));else if(d.id.startsWith('i_'))remote.images[v.id]=JSON.parse(JSON.stringify(v));}
      const hasRemote=remote.meta||Object.keys(remote.subjects).length;
      this.mode='db';
      if(hasRemote){
        S.subjects=remote.subjects;S.materials=remote.materials;S.images=remote.images;if(remote.meta)S.meta=Object.assign({streak:{count:0,last:null},log:{},pomos:{}},JSON.parse(JSON.stringify(remote.meta)));
      }else if(Object.keys(S.subjects).length){
        for(const s of Object.values(S.subjects))this.save('s',s);
        for(const m of Object.values(S.materials))this.save('m',m);
        for(const m of Object.values(S.images))this.save('i',m);
        this.save('meta');
      }
      try{localStorage.removeItem(LS_KEY)}catch(e){}
      render();
    }catch(e){this.mode='local';}
  },
  key(kind,obj){return kind==='meta'?'meta':kind+'_'+obj.id},
  save(kind,obj){
    if(kind!=='meta'&&obj&&obj.example)return;
    if(this.mode!=='db'){this.saveLocal();return}
    const k=this.key(kind,obj);
    clearTimeout(this.timers[k]);
    this.pending=this.pending||{};
    const run=this.pending[k]=()=>{
      delete this.pending[k];
      let body=kind==='meta'?S.meta:(kind==='s'?S.subjects[obj.id]:kind==='i'?S.images[obj.id]:S.materials[obj.id]);
      if(!body)return;
      body=JSON.parse(JSON.stringify(body));
      if(kind==='s'){
        let size=JSON.stringify(body).length;
        if(size>240000&&body.answers){body.answers=body.answers.slice(-200);size=JSON.stringify(body).length}
        if(size>250000){toast('Esta asignatura ocupa demasiado para guardarse entera. Borra tarjetas o temas que no uses.');return}
      }
      const ref=this.db.doc(this.path()+'/'+k);
      this.chains[k]=(this.chains[k]||Promise.resolve()).then(()=>ref.set(body)).catch(e=>{
        if(e&&e.code==='quota_exceeded')toast('Se ha llenado el espacio de Mnema. Borra materiales que ya no uses.');
        else toast('No se pudo guardar: '+(e&&e.message||'error de conexión'));
      });
    };
    this.timers[k]=setTimeout(run,600);
  },
  async flush(){
    if(this.timers.__local){clearTimeout(this.timers.__local);try{localStorage.setItem(LS_KEY,JSON.stringify({subjects:S.subjects,materials:S.materials,images:S.images,meta:S.meta}))}catch(e){}}
    Object.keys(this.pending||{}).forEach(k=>{clearTimeout(this.timers[k]);const f=this.pending[k];f&&f()});
    await Promise.all(Object.values(this.chains).map(c=>c&&c.catch(()=>{})));
  },
  remove(kind,id){
    if(this.mode!=='db'){this.saveLocal();return}
    const k=kind+'_'+id;clearTimeout(this.timers[k]);
    const ref=this.db.doc(this.path()+'/'+k);
    this.chains[k]=(this.chains[k]||Promise.resolve()).then(()=>ref.delete()).catch(()=>{});
  }
};

function chunksOf(text,size=2200){
  const parts=[];const paras=text.split(/\n\s*\n/);let buf='';
  for(const p of paras){if((buf+p).length>size&&buf){parts.push(buf);buf=''}buf+=(buf?'\n\n':'')+p;
    while(buf.length>size*1.6){parts.push(buf.slice(0,size));buf=buf.slice(size)}}
  if(buf)parts.push(buf);return parts;
}
function contextFor(subj,topic,cap=140000){
  const mats=subj.__mats||materialsOf(subj.id);
  if(!mats.length)return subj.topics.map(t=>'## '+t.title+'\n'+(t.summary||'')+'\n'+subj.cards.filter(c=>c.topicId===t.id&&c.type!=='img').map(c=>'- '+c.q+' → '+c.a).join('\n')).join('\n\n').slice(0,cap);
  if(topic&&topic.id){
    const own=mats.filter(m=>m.topicId===topic.id),blk=mats.filter(m=>topic.blockId&&m.blockId===topic.blockId&&!m.topicId);
    if(own.length||blk.length){const first=own.concat(blk).map(m=>'### '+m.name+'\n'+m.text).join('\n\n');
      if(first.length>=cap*0.5)return first.slice(0,cap);
      const rest=mats.filter(m=>!own.includes(m)&&!blk.includes(m)&&!m.topicId);
      return (first+(rest.length?'\n\n'+contextFor(Object.assign({},subj,{__mats:rest}),Object.assign({},topic,{id:null}),cap-first.length):'')).slice(0,cap)}
  }
  let full=mats.map(m=>'### '+m.name+'\n'+m.text).join('\n\n');
  if(full.length<=cap||!topic)return full.slice(0,cap);
  const words=new Set(norm([topic.title].concat(topic.keyTerms||[]).join(' ')).split(/[^a-z0-9ñ]+/).filter(w=>w.length>3));
  const chunks=chunksOf(full).map((c,i)=>{const n=norm(c);let sc=0;words.forEach(w=>{let k=0,p=0;while((p=n.indexOf(w,p))!==-1){k++;p+=w.length}sc+=k});return{c,i,sc}});
  const pick=[];let len=0;
  for(const x of chunks.slice().sort((a,b)=>b.sc-a.sc)){if(len+x.c.length>cap*0.6)break;pick.push(x);len+=x.c.length}
  return pick.sort((a,b)=>a.i-b.i).map(x=>x.c).join('\n\n[…]\n\n');
}
function topicLine(subj){const bs=subj.blocks||[];if(!bs.length)return subj.topics.map((t,i)=>(i+1)+'. '+t.title).join('\n');let n=0;const line=t=>'  '+(++n)+'. '+t.title;
  return bs.map(b=>b.title+':\n'+subj.topics.filter(t=>t.blockId===b.id).map(line).join('\n')).join('\n')+(subj.topics.some(t=>!bs.some(b=>b.id===t.blockId))?'\nSin bloque:\n'+subj.topics.filter(t=>!bs.some(b=>b.id===t.blockId)).map(line).join('\n'):'')}

/* ---------- lógica de estudio ---------- */
function cardMastery(c){return c.reps>0?clamp(c.interval/21,0,1):0}
function topicMastery(subj,tid){
  const cs=subj.cards.filter(c=>c.topicId===tid);
  const as=(subj.answers||[]).filter(a=>a.topicId===tid).slice(-12);
  const t=subj.topics.find(x=>x.id===tid);
  const parts=[];
  if(cs.length)parts.push([cs.reduce((s,c)=>s+cardMastery(c),0)/cs.length,0.5]);
  if(as.length)parts.push([as.filter(a=>a.ok).length/as.length,0.4]);
  if(t&&t.read)parts.push([1,0.1]); else parts.push([0,0.1]);
  const w=parts.reduce((s,p)=>s+p[1],0);
  return w?parts.reduce((s,p)=>s+p[0]*p[1],0)/w:0;
}
function subjectMastery(subj){if(!subj.topics.length)return 0;return subj.topics.reduce((s,t)=>s+topicMastery(subj,t.id),0)/subj.topics.length}
function dueCards(subj,topic='all'){const d=today();return subj.cards.filter(c=>(topic==='all'||c.topicId===topic)&&c.due<=d)}
function gradeCard(c,g){
  const d=today();
  if(g===0){c.reps=0;c.interval=0;c.lapses=(c.lapses||0)+1;c.ease=Math.max(1.3,c.ease-0.2)}
  else if(g===1){c.interval=Math.max(1,Math.round((c.interval||1)*1.2));c.ease=Math.max(1.3,c.ease-0.15);c.reps++}
  else if(g===2){c.interval=c.reps===0?1:c.reps===1?3:Math.round(c.interval*c.ease);c.reps++}
  else{c.interval=c.reps===0?4:Math.round(Math.max(c.interval,1)*c.ease*1.3);c.ease+=0.15;c.reps++}
  c.due=addDays(d,c.interval);c.last=d;
}
function nextIntervalLabel(c,g){const x=Object.assign({},c);gradeCard(x,g);return g===0?'hoy':x.interval===1?'1 día':x.interval+' días'}
function markActive(n=1){
  const d=today();S.meta.log[d]=(S.meta.log[d]||0)+n;
  const st=S.meta.streak||{count:0,last:null};
  if(st.last!==d){st.count=st.last===addDays(d,-1)?st.count+1:1;st.last=d}
  S.meta.streak=st;
  const keys=Object.keys(S.meta.log).sort();if(keys.length>120)keys.slice(0,keys.length-120).forEach(k=>delete S.meta.log[k]);
  saveMeta();
}
function streakNow(){const st=S.meta.streak||{};if(!st.last)return 0;const d=today();return(st.last===d||st.last===addDays(d,-1))?st.count:0}
function findTopicId(subj,title){
  if(!title)return subj.topics[0]&&subj.topics[0].id;
  const n=norm(title);
  let t=subj.topics.find(x=>norm(x.title)===n)||subj.topics.find(x=>n.includes(norm(x.title))||norm(x.title).includes(n));
  return t?t.id:(subj.topics[0]&&subj.topics[0].id);
}
function buildPlan(subj){
  const items=[];const d=today();
  const due=dueCards(subj).length;
  const left=subj.examDate?daysBetween(d,subj.examDate):null;
  if(!subj.topics.length){
    items.push({txt:'Crea los temas de la asignatura y sube dentro sus archivos',go:'temario',cta:'Empezar'});
    return {items,week:[],left};
  }
  if(due)items.push({txt:'Repasa '+due+' tarjeta'+(due>1?'s':'')+' pendiente'+(due>1?'s':''),go:'tarjetas',cta:'Repasar'});
  const ranked=subj.topics.map(t=>({t,m:topicMastery(subj,t.id)})).sort((a,b)=>a.m-b.m);
  const studyDays=left!==null&&left>0?Math.max(1,left-1):7;
  const per=clamp(Math.ceil(ranked.length/studyDays),1,3);
  const actionFor=(t)=>{const n=subj.cards.filter(c=>c.topicId===t.id).length;
    if(!t.summary)return{txt:'Lee el resumen de «'+t.title+'»',go:'temario',topic:t.id,cta:'Resumen'};
    if(n<5)return{txt:'Crea tarjetas de «'+t.title+'»',go:'temario',topic:t.id,cta:'Tarjetas'};
    return{txt:'Haz un test de «'+t.title+'»',go:'tests',topic:t.id,cta:'Test'}};
  if(left!==null&&left>=0&&left<=2)items.push({txt:'Haz un simulacro de examen completo',go:'tests',sim:true,cta:'Simulacro'});
  else ranked.slice(0,per).forEach(x=>items.push(Object.assign(actionFor(x.t),{m:x.m})));
  const week=[];
  for(let i=0;i<7;i++){
    const day=addDays(d,i);let label;
    if(left!==null&&i===left)label='Examen';
    else if(left!==null&&i>left)label='—';
    else if(left!==null&&left-i<=2&&left-i>=1)label='Simulacro + repaso de fallos';
    else{const sl=[];for(let k=0;k<per;k++){const x=ranked[(i*per+k)%ranked.length];if(x&&!sl.includes(x.t.title))sl.push(x.t.title)}label=sl.join(' · ')}
    week.push({day,label,exam:left!==null&&i===left});
  }
  return {items,week,left};
}

/* ---------- markdown ligero ---------- */
function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/==(.+?)==/g,'<mark>$1</mark>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>')}
function md(src){
  const lines=String(src||'').split('\n');let out='',inList=false;
  const close=()=>{if(inList){out+='</ul>';inList=false}};
  for(let raw of lines){const l=raw.trim();
    if(!l){close();continue}
    let m;
    if((m=l.match(/^#{1,4}\s+(.*)/))){close();out+='<h4>'+inl(m[1])+'</h4>';continue}
    if((m=l.match(/^(?:[-*•]|\d+[.)])\s+(.*)/))){if(!inList){out+='<ul>';inList=true}out+='<li>'+inl(m[1])+'</li>';continue}
    close();out+='<p>'+inl(l)+'</p>';
  }
  close();return '<div class="md">'+out+'</div>';
}

    (withPdf>1?'<button class="btn small ghost" type="button" data-act="dlAllNotes" data-f="pdf">Todo en PDF</button><button class="btn small ghost" type="button" data-act="dlAllNotes" data-f="docx">Todo en Word</button>':'')+

function fileSize(n){if(!n)return '';return n<1024*1024?Math.max(1,Math.round(n/1024))+' KB':(n/1048576).toFixed(1).replace('.',',')+' MB'}
function renderBiblioteca(s,groups){
  const intro='<div class="row" style="justify-content:space-between"><div><h2 class="sec">Biblioteca</h2><p class="muted" style="margin:2px 0 0;font-size:14px">Los archivos que tú has subido a esta asignatura. Los PDF que genera Mnema están dentro de cada tema.</p></div>'+(s.example?'':'<button class="btn small" type="button" data-act="libUpload">+ Subir archivos</button>')+'</div>';
  if(!groups.length)return intro+'<div class="panel empty"><h2 class="sec">Tu biblioteca está vacía</h2><p class="muted">Sube los archivos dentro de cada tema (o desde aquí eligiendo el tema). Aparecerán en esta biblioteca.</p>'+(s.example?'':'<button class="btn" type="button" data-act="libUpload">Subir archivos</button>')+'</div>';
  const order=[];blocksOf(s).forEach(b=>topicsIn(s,b.id).forEach(t=>order.push(t)));topicsIn(s,null).forEach(t=>order.push(t));
  const sections=order.map(t=>({t,gs:groups.filter(g=>g.parts[0].topicId===t.id)})).filter(x=>x.gs.length);
  const loose=groups.filter(g=>!g.parts[0].topicId||!s.topics.some(t=>t.id===g.parts[0].topicId));
  const row=g=>{const m=g.parts[0];const len=g.parts.reduce((n,x)=>n+x.text.length,0);const hl=g.parts.reduce((n,x)=>n+(x.hl||[]).length,0);const open=g.parts.some(x=>x.id===V.readMat);
    return '<div class="lrow"><span class="lic '+esc(kindOf(g.base).toLowerCase())+'" aria-hidden="true">'+esc(kindOf(g.base))+'</span><span class="lname"><b title="'+esc(g.base)+'">'+esc(g.base)+'</b><small>'+(m.size?fileSize(m.size)+' · ':'')+'~'+Math.max(1,Math.round(len/2400))+' pág. de texto'+(m.createdAt?' · '+fmtDate(isoDate(new Date(m.createdAt))):'')+(hl?' · '+hl+' subrayados':'')+'</small></span>'+
      '<span class="row lacts" style="gap:6px">'+(m.fileUrl?'<a class="btn small soft" href="'+esc(m.fileUrl)+'" target="_blank" rel="noopener">Abrir original</a>':'')+'<button class="btn small '+(open?'':'ghost')+'" type="button" data-act="readMat" data-id="'+esc(open?V.readMat:m.id)+'">'+(open?'Cerrar':'Leer y subrayar')+'</button>'+
      (s.example?'':'<label class="sr" for="mv_'+esc(g.key)+'">Mover a otro tema</label><select id="mv_'+esc(g.key)+'" data-move="'+esc(g.key)+'" class="lmove"><option value="">Mover a…</option>'+topicOptions(s,null)+'</select><button class="btn small ghost" type="button" data-act="renameGroup" data-g="'+esc(g.key)+'">Renombrar</button><button class="btn small ghost" type="button" data-act="replaceGroup" data-g="'+esc(g.key)+'">Reemplazar</button><button class="btn small danger" type="button" data-act="delGroup" data-g="'+esc(g.key)+'">Quitar</button>')+'</span></div>'};
  return intro+sections.map(x=>'<section class="panel lsec"><div class="lsec-h"><span class="eyebrow">'+esc(blockOf(s,x.t)?blockOf(s,x.t).title:'Tema')+'</span><h3>'+esc(x.t.title)+'</h3></div>'+x.gs.map(row).join('')+'</section>').join('')+
    (loose.length?'<section class="panel lsec"><div class="lsec-h"><span class="eyebrow">Sin tema</span><h3>Archivos sin tema</h3><p class="muted" style="margin:2px 0 0;font-size:13.5px">Muévelos a su tema con «Mover a…» para que entren en el PDF del tema.</p></div>'+loose.map(row).join('')+'</section>':'');
}
function libUploadModal(s){

    b.onclick=e=>{const a=e.target.closest('[data-mact]');if(!a)return;if(a.dataset.mact==='cancel')return closeModal();const tid=$('#mUpTopic').value;closeModal();

function topicFiles(s,t){

let pdfLibP=null;
function loadScript(src){return new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=src;sc.onload=res;sc.onerror=()=>rej(new Error('No se pudo cargar '+src));document.head.appendChild(sc)})}
function pdfLib(){if(!pdfLibP)pdfLibP=(window.pdfMake&&window.pdfMake.vfs?Promise.resolve():loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/pdfmake.min.js').then(()=>loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/vfs_fonts.min.js'))).then(()=>window.pdfMake).catch(e=>{pdfLibP=null;throw e});return pdfLibP}
async function storeOriginal(f){
  try{
    const C=window.claude;const A=C&&C.use?await C.use('assets'):null;if(!A)return null;
    const ext=(f.name.split('.').pop()||'').toLowerCase();
    const type=f.type||({pdf:'application/pdf',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',txt:'text/plain',md:'text/markdown',markdown:'text/markdown'}[ext]||'');
    if(!type||f.size>20*1024*1024)return null;
    const r=await A.upload(new Blob([f],{type}),type);return r&&r.url?{url:r.url,size:f.size,mime:type}:null;
  }catch(e){return null}
}
function kindOf(n){n=n.toLowerCase();return n.endsWith('.pdf')?'PDF':n.endsWith('.docx')?'Word':/\.(png|jpe?g|webp|gif|heic)$/.test(n)||n.startsWith('foto')?'Foto':'Texto'}

/* lector con subrayado */
function readerText(m){
  const hl=(m.hl||[]).slice().sort((a,b)=>a.start-b.start);const text=m.text;let out='',pos=0;
  hl.forEach((h,i)=>{if(h.start<pos)return;out+=esc(text.slice(pos,h.start))+'<mark data-h="'+h.id+'"'+(h.note?' data-n="'+(i+1)+'"':'')+' title="'+(h.note?esc(h.note):'Subrayado')+'">'+esc(text.slice(h.start,h.end))+'</mark>';pos=h.end});
  return out+esc(text.slice(pos));
}

function readSelection(){

  const r=sel.getRangeAt(0);if(!box.contains(r.startContainer)||!box.contains(r.endContainer))return null;
  const pre=document.createRange();pre.selectNodeContents(box);pre.setEnd(r.startContainer,r.startOffset);
  let start=pre.toString().length;let txt=r.toString();let end=start+txt.length;
  const lead=txt.length-txt.trimStart().length,trail=txt.length-txt.trimEnd().length;start+=lead;end-=trail;txt=txt.trim();

  const tag=oldGroup&&oldGroup[0]?{topicId:oldGroup[0].topicId||null,blockId:oldGroup[0].blockId||null}:{topicId:opts.topicId||null,blockId:opts.blockId||null};
  files=Array.from(files||[]);if(!files.length)return;
  const imgs=files.filter(f=>f.type.startsWith('image/'));
  const docs=files.filter(f=>!f.type.startsWith('image/'));
  let added=0;
  for(const f of docs){
    try{
      setStatus('Leyendo '+f.name+'…');
      let text=await extractFile(f);
      text=cleanText(text);
      if(!text||text.length<30)throw new Error('no se encontró texto en '+f.name);
      const orig=await storeOriginal(f);
      addMaterial(s,f.name,text,Object.assign({},tag,orig?{fileUrl:orig.url,size:orig.size,mime:orig.mime}:{size:f.size}));added++;
    }catch(e){console.warn(e);setStatus('No se pudo leer '+f.name+': '+(e.message||e.code||'formato no reconocido')+'.',true);await pause(2500)}
  }

    try{const text=await imagesToText(imgs,(i,n)=>setStatus('Transcribiendo fotos con IA… '+i+' de '+n));if(text.trim()){addMaterial(s,'Fotos de apuntes ('+imgs.length+')',cleanText(text),tag);added++}}
    catch(e){setStatus(errMsg(e),true);await pause(3000)}
  }
  if(added&&oldGroup&&oldGroup.length){oldGroup.forEach(m=>{delete S.materials[m.id];Store.remove('m',m.id);if(V.readMat===m.id)V.readMat=null});s.materialsChanged=true;saveSubject(s)}
  V.status=null;render();
  if(added){const where=tag.topicId?(s.topics.find(x=>x.id===tag.topicId)||{}).title:tag.blockId?(blocksOf(s).find(x=>x.id===tag.blockId)||{}).title:'';
    toast(oldGroup?'Archivo reemplazado.':(added===1?'Archivo añadido':added+' archivos añadidos')+(where?' a «'+where+'». Preparando sus apuntes…':'.'));if(!s.topics.length&&!tag.topicId&&!tag.blockId)analyze();
    else if(tag.topicId&&s.topics.some(x=>x.id===tag.topicId))makeNotes(tag.topicId);

}
const pause=ms=>new Promise(r=>setTimeout(r,ms));

async function extractFile(f){
  const n=f.name.toLowerCase();
  if(n.endsWith('.pdf'))return pdfText(f);
  if(n.endsWith('.docx')){if(!window.mammoth)throw new Error('no se pudo cargar el lector de Word');const r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});return r.value}
  if(n.endsWith('.doc'))throw new Error('guarda el archivo como .docx o PDF');
  return f.text();
}
async function pdfText(f){
  if(!window.pdfjsLib)throw new Error('no se pudo cargar el lector de PDF');
  const doc=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
  let out='';
  for(let p=1;p<=doc.numPages;p++){
    setStatus('Leyendo '+f.name+'… página '+p+' de '+doc.numPages);
    const pg=await doc.getPage(p);const tc=await pg.getTextContent();
    out+=tc.items.map(it=>it.str+(it.hasEOL?'\n':' ')).join('')+'\n\n';
  }
  if(out.replace(/\s/g,'').length<40*doc.numPages){
    const lim=await imageLimits();
    if(!lim)throw new Error('parece escaneado; entra con tu cuenta para que la IA lo lea');
    const maxP=Math.min(doc.numPages,30);const blobs=[];
    for(let p=1;p<=maxP;p++){setStatus('Preparando páginas escaneadas… '+p+' de '+maxP);const pg=await doc.getPage(p);const vp=pg.getViewport({scale:1.6});const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;blobs.push(await new Promise(r=>cv.toBlob(r,'image/jpeg',0.82)))}
    out=await imagesToText(blobs,(i,n)=>setStatus('Leyendo páginas escaneadas con IA… '+i+' de '+n));
    if(doc.numPages>maxP)toast('Solo se han leído las primeras '+maxP+' páginas escaneadas.');
  }
  return out;
}
async function imagesToText(blobs,onProg){

  const per=Math.max(1,Math.min(lim.maxCount||1,4));let out='';
  for(let i=0;i<blobs.length;i+=per){
    onProg&&onProg(Math.min(i+per,blobs.length),blobs.length);

async function analyze(){

    const r=await sm.json(SYS+'\n\n<temario>\n'+ctx+'\n</temario>\n\nOrganiza este temario en BLOQUES y, dentro de cada bloque, en TEMAS, en el orden en que aparecen. Si el temario ya tiene sus propios bloques, unidades o partes y sus temas numerados, respeta exactamente esa división y sus títulos. Si no los tiene, agrupa los temas en bloques lógicos (entre 1 y 6 bloques; entre 3 y 20 temas en total). Responde solo con JSON con esta forma: {"bloques":[{"titulo":"Título corto del bloque","temas":[{"titulo":"Título corto del tema","conceptos":["concepto 1","concepto 2"]}]}]} con entre 4 y 8 conceptos clave por tema.',{modelTier:'default'});
    let bloques=(r&&Array.isArray(r.bloques)&&r.bloques)||[];
    if(!bloques.length&&r&&Array.isArray(r.temas))bloques=[{titulo:'',temas:r.temas}];
    bloques=bloques.filter(b=>b&&Array.isArray(b.temas)&&b.temas.length);
    if(!bloques.length)throw{message:'No se encontraron temas en el material.'};
    const old=s.topics;const oldBlocks=blocksOf(s);
    const nb=[];const nt=[];
    bloques.slice(0,8).forEach(b=>{
      const title=String(b.titulo||'').trim();let blockId=null;
      if(title&&bloques.length>1||title&&bloques.length===1&&oldBlocks.length){const prev=oldBlocks.find(o=>norm(o.title)===norm(title));const blk=prev||{id:rid(),title:title.slice(0,80)};nb.push(blk);blockId=blk.id}
      b.temas.slice(0,20).forEach(t=>{if(nt.length>=30)return;const prev=old.find(o=>norm(o.title)===norm(t.titulo));
        nt.push(prev?Object.assign(prev,{keyTerms:t.conceptos||prev.keyTerms,blockId}):{id:rid(),title:String(t.titulo||'Tema'),blockId,keyTerms:(t.conceptos||[]).map(String).slice(0,8),summary:'',read:false})});
    });
    s.blocks=nb;s.topics=nt;

    s.cards.forEach(c=>{if(!ids.has(c.topicId))c.topicId=s.topics[0].id});
    s.materialsChanged=false;saveSubject(s);markActive();setTimeout(()=>makeAllNotes(s,true),300);toast('Temario organizado en '+(s.blocks.length?s.blocks.length+' bloque'+(s.blocks.length===1?'':'s')+' y ':'')+s.topics.length+' temas.');

function wrap2(s,max){s=String(s||'');if(s.length<=max)return[s];let cut=s.lastIndexOf(' ',max);if(cut<max*0.5)cut=max;const a=s.slice(0,cut).trim();let b=s.slice(cut).trim();if(b.length>max)b=b.slice(0,max-1).trim()+'…';return[a,b]}
const BRC=['var(--spark)','var(--good)','var(--warn)','var(--bad)','var(--anil)','var(--spark-ink)','var(--ink-2)','var(--good)'];
function mindSvg(m){
  const ramas=(m.ramas||[]).slice(0,8).map((r,i)=>({n:String(r.nombre||''),h:(r.hijos||[]).slice(0,6).map(String),c:BRC[i%BRC.length]}));
  const right=[],left=[];ramas.forEach((r,i)=>(i%2===0?right:left).push(r));
  const rowH=44,gapB=14;
  const sideH=side=>side.length?side.reduce((n,r)=>n+Math.max(1,r.h.length)*rowH+gapB,0)-gapB:0;
  const H=Math.round(Math.max(sideH(right),sideH(left),120)+40);const W=1160,cx=580,cy=H/2;

    let y=cy-sideH(side)/2;
    side.forEach(r=>{
      const rows=Math.max(1,r.h.length);const bh=rows*rowH;const by=y+bh/2;
      const bw=170,bx=dir>0?cx+110:cx-280;const inE=dir>0?bx:bx+bw,outE=dir>0?bx+bw:bx;const cE=dir>0?cx+90:cx-90;const mx=(cE+inE)/2;
      out+='<path d="M'+cE+' '+cy+' C '+mx+' '+cy+', '+mx+' '+by+', '+inE+' '+by+'" fill="none" stroke="'+r.c+'" stroke-width="3"/>';
      r.h.forEach((h,k)=>{
        const hy=y+k*rowH+rowH/2;const hw=240,hx=dir>0?cx+320:cx-560;const hE=dir>0?hx:hx+hw;const m2=(outE+hE)/2;
        out+='<path d="M'+outE+' '+by+' C '+m2+' '+by+', '+m2+' '+hy+', '+hE+' '+hy+'" fill="none" stroke="'+r.c+'" stroke-width="1.6" opacity=".75"/>';
        out+='<rect x="'+hx+'" y="'+(hy-18)+'" width="'+hw+'" height="36" rx="9" fill="var(--surface)" stroke="'+r.c+'" stroke-width="1.3"/>';
        const L=wrap2(h,34);

      });
      out+='<rect x="'+bx+'" y="'+(by-22)+'" width="'+bw+'" height="44" rx="12" fill="var(--surface-2)" stroke="'+r.c+'" stroke-width="2.5"/>';
      const B=wrap2(r.n,20);
      out+=B.length===1?'<text x="'+(bx+bw/2)+'" y="'+(by+5)+'" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">'+esc(B[0])+'</text>':'<text x="'+(bx+bw/2)+'" y="'+(by-3)+'" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">'+esc(B[0])+'</text><text x="'+(bx+bw/2)+'" y="'+(by+12)+'" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">'+esc(B[1])+'</text>';
      y+=bh+gapB;
    });
  };
  draw(right,1);draw(left,-1);
  const C=wrap2(m.centro||'',22);
  out+='<rect x="'+(cx-90)+'" y="'+(cy-30)+'" width="180" height="60" rx="16" fill="var(--anil)"/>';
  out+=C.length===1?'<text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" font-size="15" font-weight="700" fill="var(--surface)">'+esc(C[0])+'</text>':'<text x="'+cx+'" y="'+(cy-3)+'" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--surface)">'+esc(C[0])+'</text><text x="'+cx+'" y="'+(cy+13)+'" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--surface)">'+esc(C[1])+'</text>';

const ttsCache=new Map();let podAudio=null;
function ttsUrl(text,voz){const k=(voz||'A')+'|'+text;if(!ttsCache.has(k)){const p=window.mnemaTTS.audio(text,voz).catch(e=>{ttsCache.delete(k);throw e});ttsCache.set(k,p)}return ttsCache.get(k)}
function podLines(P){if(P.lines)return P.lines;const t=cur().topics.find(x=>x.id===P.id);return t&&t.podcast||null}
function podFinish(P){if(V.pod!==P)return;V.pod=null;V.speaking=null;markActive();if(!P.lines)toast('Pódcast terminado.');render()}
async function podSpeak(){
  const P=V.pod;if(!P)return;const lines=podLines(P);
  if(!lines){V.pod=null;return}
  if(P.i>=lines.length){podFinish(P);return}
  const l=lines[P.i];
  const next=()=>{if(V.pod!==P||!P.playing)return;P.i++;podSpeak()};
  if(window.mnemaTTS&&!P.noTTS){
    try{
      highlightPod();
      const url=await ttsUrl(l.texto,l.voz);
      if(V.pod!==P||!P.playing)return;
      if(!podAudio){podAudio=new Audio();podAudio.preload='auto'}
      podAudio.onended=next;podAudio.onerror=next;
      if(podAudio.src!==url)podAudio.src=url;
      podAudio.playbackRate=V.podRate||1;
      await podAudio.play();
      const n=lines[P.i+1];if(n)ttsUrl(n.texto,n.voz).catch(()=>{});
      const n2=lines[P.i+2];if(n2)ttsUrl(n2.texto,n2.voz).catch(()=>{});
      return;
    }catch(e){
      if(e&&e.name==='NotAllowedError'){P.playing=false;render();toast('Pulsa «Escuchar» otra vez para empezar el audio.');return}
      P.noTTS=true;toast('Las voces naturales no están disponibles ahora; uso la voz del dispositivo.');
    }
  }
  const ss=window.speechSynthesis;if(!ss){P.playing=false;render();toast('Tu navegador no puede reproducir voz.');return}
  const vs=voicesES();
  const u=new SpeechSynthesisUtterance(l.texto);u.lang='es-ES';u.rate=V.podRate||1;
  const isB=l.voz==='B';
  if(vs.length>1){u.voice=isB?vs[1]:vs[0]}else{if(vs[0])u.voice=vs[0];u.pitch=isB?0.78:1.15}
  u.onend=next;u.onerror=e=>{if(e&&e.error==='interrupted'||e&&e.error==='canceled')return;next()};
  ss.speak(u);highlightPod();
}

function summaryLines(text){

}

function similarity(a,b){
  const tok=x=>norm(x).split(/[^a-z0-9ñ]+/).filter(w=>w.length>2);
  const A=new Set(tok(a)),B=tok(b);if(!B.length)return 0;

  return hit/Bs.size;
}

function tapTile(i){
  const G=V.game;if(!G||G.done)return;const x=G.tiles[i];if(x.gone)return;
  G.bad=null;
  if(G.sel===null){G.sel=i;render();return}
  if(G.sel===i){G.sel=null;render();return}
  const y=G.tiles[G.sel];
  if(y.id===x.id){x.gone=y.gone=true;G.sel=null;G.matched++;
    if(G.matched===G.n){G.done=true;clearInterval(V.gameTimer);G.time=(Date.now()-G.start)/1000+G.miss*2;const s=cur();G.record=!s.bestMatch||G.time<s.bestMatch;if(G.record){s.bestMatch=G.time;saveSubject(s)}markActive(G.n);pushScore(s,{match:G.time})}}
  else{G.miss++;G.bad=[G.sel,i];G.sel=null;setTimeout(()=>{if(V.game===G){G.bad=null;render()}},450)}
  render();
}

function shrinkImage(file,max){
  return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(u);cv.toBlob(b=>b?res(b):rej(new Error('imagen')),'image/jpeg',0.85)};img.onerror=()=>rej(new Error('imagen'));img.src=u});
}
let assetsP=null;
async function storeImage(blob){
  if(Store.mode==='db'){
    if(!assetsP){const C=window.claude;assetsP=C&&C.use?C.use('assets').catch(()=>null):Promise.resolve(null)}
    const A=await assetsP;
    if(A){const r=await A.upload(blob);return r.url}
  }
  const small=await shrinkImage(blob,900);
  const url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(small)});
  const id=rid();S.images[id]={id,subjectId:cur().id,url,createdAt:Date.now()};Store.save('i',S.images[id]);
  return 'local:'+id;
}

async function startTest(opts={}){

    if(opts.missed){const ms=missedConcepts(s).map(m=>norm(m.concept));bank=s.quizBank.filter(q=>ms.some(m=>norm(q.concepto).includes(m)||m.includes(norm(q.concepto))));if(!bank.length)bank=s.quizBank}

  return (r&&r.correcciones)||null;
}
async function finishTest(){
  const T=V.test;if(!T||T.done)return;clearInterval(V.testTimer);
  const s=cur();
  const open=[];T.qs.forEach((q,i)=>{if((q.tipo==='corta'||q.tipo==='desarrollo')){const a=T.ans[i]||{text:''};if(!a.checked)open.push({i,q,text:a.text||''})}});
  if(open.length){
    T.grading=true;V.test.done=true;render();
    try{const res=await gradeOpenAnswers(open.filter(o=>o.text.trim()));let k=0;
      open.forEach(o=>{const a=T.ans[o.i]=T.ans[o.i]||{};a.checked=true;if(!o.text.trim()){a.score=0;a.verdict='Sin responder';return}const g=res&&res[k++];if(g){a.score=clamp(Number(g.nota)/10,0,1);a.verdict=g.veredicto;a.feedback=g.comentario}else{a.score=0;a.verdict='Sin corregir';a.feedback='No se pudo corregir automáticamente. Compara con la respuesta modelo.'}});
    }catch(e){toast(errMsg(e));open.forEach(o=>{const a=T.ans[o.i]=T.ans[o.i]||{};a.checked=true;a.score=a.score||0;a.verdict='Sin corregir'})}
    T.grading=false;
  }
  T.qs.forEach((q,i)=>{const a=T.ans[i]=T.ans[i]||{given:null,score:0,checked:true,verdict:'Sin responder'};if(!a.checked){a.checked=true;a.score=checkClosed(q,a.given)?1:0}});
  T.done=true;
  const score=T.ans.reduce((n,a)=>n+(a.score||0),0)/T.qs.length;T.score=score;
  s.answers=s.answers||[];
  T.qs.forEach((q,i)=>s.answers.push({topicId:findTopicId(s,q.tema),ok:(T.ans[i].score||0)>=0.6,at:Date.now(),concept:q.concepto||q.pregunta.slice(0,40)}));
  if(s.answers.length>400)s.answers=s.answers.slice(-400);
  s.tests=(s.tests||[]).concat([{label:T.label,date:today(),score,n:T.qs.length}]).slice(-30);
  saveSubject(s);markActive(T.qs.length);pushScore(s,{test:score});render();
}

async function sendChat(text){
  text=String(text||'').trim();if(!text||V.busy.tutor)return;
  const s=cur();const chat=chatOf(s.id);
  const t=scopeFocus(s);const ts=scopeTopics(s);

  V.busy.tutor=true;render();
  const mode=V.tutorMode==='explica'
    ?'Actúa como un profesor paciente: explica con claridad, con ejemplos y analogías, y comprueba al final con una pregunta breve si se ha entendido. Respuestas de 80 a 220 palabras salvo que pidan más.'
    :'Actúa como un tutor socrático: NO des la respuesta directamente. Haz una pregunta cada vez para que el estudiante razone; si responde, dile qué está bien y qué falta, y sigue con la siguiente pregunta. Si se atasca dos veces, dale una pista. Respuestas breves (máximo 120 palabras).';
  const intro=SYS+'\n\n<temario>\n'+contextFor(s,t,90000)+'\n</temario>\n\n'+(ts?'El estudiante quiere centrarse en '+(ts.length===1?'el tema «'+ts[0].title+'»':'estos temas: '+ts.map(x=>'«'+x.title+'»').join(', '))+'.\n':'')+mode+' Cuando cites algo del temario, ponlo entre comillas. Puedes usar "## " para títulos, "- " para listas, **negrita** y ==término== para resaltar conceptos clave.';
  const turns=[{role:'user',content:intro}].concat(chat.slice(0,-1).slice(-16).map(m=>({role:m.role,content:m.content||'…'})));
  try{
    const sm=await needSample();
    const r=await sm(turns,{cache:false,modelTier:'default',onText:u=>{reply.content=u.text;const box=$('#chatBox');if(box&&V.tab==='tutor'){const last=box.lastElementChild;if(last)last.innerHTML=md(u.text);box.scrollTop=box.scrollHeight}}});
    reply.content=r.text;markActive();
  }catch(e){chat.pop();chat.pop();toast(errMsg(e));const inp=$('#chatIn');if(inp&&!inp.value)setTimeout(()=>{const i=$('#chatIn');if(i)i.value=text},0)}
  finally{delete V.busy.tutor;render();const i=$('#chatIn');if(i)i.focus()}
}

/* ---------- compartir con compañeros ---------- */
const CODE_CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newCode(){let c='';for(let i=0;i<6;i++)c+=CODE_CH[Math.floor(Math.random()*CODE_CH.length)];return c}
function snapshotFor(s){
  const snap={code:s.shareCode,name:s.name,examDate:s.examDate||null,owner:Store.uid,updatedAt:Date.now(),
    blocks:(s.blocks||[]).map(b=>({id:b.id,title:b.title})),
    topics:s.topics.map(t=>({id:t.id,title:t.title,blockId:t.blockId||null,keyTerms:t.keyTerms||[],summary:t.summary||'',notes:t.notes||'',mindmap:t.mindmap||null,table:t.table||null,podcast:t.podcast||null})),
    cards:s.cards.filter(c=>c.type!=='img'||!String(c.img).startsWith('local:')).map(c=>{const o={id:c.orig||c.id,topicId:c.topicId,q:c.q,a:c.a,src:c.src||''};if(c.type==='img')Object.assign(o,{type:'img',img:c.img,rects:c.rects,ri:c.ri,mode:c.mode});return o})};
  const size=()=>JSON.stringify(snap).length;
  if(size()>240000)snap.topics.forEach(t=>t.podcast=null);
  if(size()>240000)snap.topics.forEach(t=>t.notes='');
  if(size()>240000)snap.topics.forEach(t=>{t.table=null;t.mindmap=null});
  while(size()>240000&&snap.cards.length>50)snap.cards=snap.cards.slice(0,Math.floor(snap.cards.length*0.8));
  if(size()>250000)throw{message:'Esta asignatura es demasiado grande para compartirla entera.'};
  return snap;
}
function needCloud(){if(Store.mode!=='db'||!Store.db)throw{message:'Para compartir, entra con tu cuenta (botón «Entrar» arriba).'}}
async function publishShare(s){
  needCloud();
  if(!s.shareCode){
    let code=newCode();
    for(let k=0;k<4;k++){const d=await Store.db.doc('shared/'+code).get();if(!d.exists)break;code=newCode()}
    s.shareCode=code;saveSubject(s);
  }
  await Store.db.doc('shared/'+s.shareCode).set(snapshotFor(s));
  s.sharedAt=Date.now();saveSubject(s);
}
async function joinCode(raw){
  needCloud();
  const code=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==6)throw{message:'El código tiene 6 letras o números.'};
  const mine=Object.values(S.subjects).find(x=>x.shareCode===code);
  if(mine){S.meta.activeId=mine.id;saveMeta();return mine}
  const d=await Store.db.doc('shared/'+code).get();
  if(!d.exists)throw{message:'No hay ningún grupo con ese código. Revisa que esté bien escrito.'};
  const v=JSON.parse(JSON.stringify(d.data()));const day=today();
  const s={id:rid(),name:String(v.name||'Asignatura compartida'),examDate:v.examDate||null,createdAt:Date.now(),shareCode:code,joined:true,
    blocks:(v.blocks||[]).map(b=>({id:b.id,title:b.title})),
    topics:(v.topics||[]).map(t=>Object.assign({read:false},t)),
    cards:(v.cards||[]).map(c=>Object.assign({},c,{id:rid(),orig:c.id,ease:2.5,interval:0,reps:0,lapses:0,due:day})),answers:[],tests:[]};
  S.subjects[s.id]=s;S.meta.activeId=s.id;saveSubject(s);saveMeta();
  return s;
}
async function pullShare(s){
  needCloud();const d=await Store.db.doc('shared/'+s.shareCode).get();
  if(!d.exists)throw{message:'Este grupo ya no existe.'};
  const v=JSON.parse(JSON.stringify(d.data()));const day=today();let nT=0,nC=0;
  (v.blocks||[]).forEach(b=>{if(!blocksOf(s).some(x=>x.id===b.id))blocksOf(s).push({id:b.id,title:b.title})});
  (v.topics||[]).forEach(t=>{const mine=s.topics.find(x=>x.id===t.id);if(mine&&t.blockId&&!mine.blockId)mine.blockId=t.blockId;if(mine){['summary','notes','mindmap','table','podcast','keyTerms','title'].forEach(k=>{if(t[k]&&!mine[k])mine[k]=t[k]})}else{s.topics.push(Object.assign({read:false},t));nT++}});
  const have=new Set(s.cards.map(c=>c.orig||c.id));
  (v.cards||[]).forEach(c=>{if(!have.has(c.id)){s.cards.push(Object.assign({},c,{id:rid(),orig:c.id,ease:2.5,interval:0,reps:0,lapses:0,due:day}));nC++}});
  saveSubject(s);return{nT,nC};
}
async function pushScore(s,x){
  if(!s||!s.shareCode||Store.mode!=='db'||!Store.db)return;
  try{
    const ref=Store.db.doc('shared/'+s.shareCode+'/scores/'+Store.uid);const d=await ref.get();
    const o=d.exists?JSON.parse(JSON.stringify(d.data())):{best:null,match:null,tests:0};
    if(x.test!=null){o.best=Math.max(o.best||0,x.test);o.tests=(o.tests||0)+1}
    if(x.match!=null)o.match=o.match?Math.min(o.match,x.match):x.match;
    o.uid=Store.uid;o.updatedAt=Date.now();await ref.set(o);V.board=null;
  }catch(e){console.warn(e)}
}
async function loadBoard(code){
  if(V.boardLoading===code)return;V.boardLoading=code;

    const snap=await Store.db.collection('shared/'+code+'/scores').limit(200).get();
    const rows=snap.docs.map(d=>d.data()).filter(Boolean).map(x=>JSON.parse(JSON.stringify(x)));

    V.board={code,rows,names};
  }catch(e){V.board={code,rows:[],names:{},err:true}}
  V.boardLoading=null;if(V.tab==='progreso')render();
}

function mIcon(k,size){return '<svg width="'+(size||24)+'" height="'+(size||24)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+MI[k]+'</svg>'}
function renderManual(){
  const sec=V.manSec&&MANUAL.find(x=>x.id===V.manSec);
  if(!sec){
    const q=norm(V.manQ||'');
    const list=MANUAL.filter(x=>!q||norm(x.title+' '+x.desc+' '+(x.steps||[]).join(' ')+' '+(x.items||[]).map(i=>i.join(' ')).join(' ')).includes(q));
    return '<section class="man-hero"><div><span class="eyebrow">Manual de uso</span><h2>¿Cómo podemos ayudarte?</h2><p>Todo lo que puedes hacer con Mnema, paso a paso.</p></div><label class="sr" for="manQ">Buscar en el manual</label><input type="search" id="manQ" placeholder="Busca: tarjetas, carpetas, simulacro…" value="'+esc(V.manQ||'')+'"></section>'+
      (list.length?'<div class="man-grid">'+list.map(x=>'<button class="man-card" type="button" data-act="manOpen" data-v="'+x.id+'" style="--c:'+x.color+'"><span class="man-ic">'+mIcon(x.icon)+'</span><b>'+esc(x.title)+'</b><span>'+esc(x.desc)+'</span><span class="man-go" aria-hidden="true">Leer →</span></button>').join('')+'</div>':'<div class="panel empty"><b>Sin resultados</b><p class="muted">Prueba con otra palabra o escríbenos desde Ayuda y contacto.</p></div>');
  }
  const i=MANUAL.indexOf(sec);const prev=MANUAL[i-1],next=MANUAL[i+1];
  const steps=sec.steps?'<ol class="man-steps">'+sec.steps.map(t=>'<li><span>'+inl(t)+'</span></li>').join('')+'</ol>':'';
  const items=sec.items?'<div class="man-items">'+sec.items.map(([k,t])=>'<div class="man-item"><b>'+esc(k)+'</b><p>'+inl(t)+'</p></div>').join('')+'</div>':'';
  const tip=sec.tip?'<div class="tip"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg><span><b>Consejo:</b> '+inl(sec.tip)+'</span></div>':'';
  return '<nav class="crumb" aria-label="Ruta" style="margin:0"><button type="button" data-act="manOpen" data-v="">‹ Manual de uso</button></nav>'+
    '<article class="man-art" style="--c:'+sec.color+'"><header class="man-art-h"><span class="man-ic big">'+mIcon(sec.icon,30)+'</span><div><h2>'+esc(sec.title)+'</h2><p>'+esc(sec.desc)+'</p></div></header>'+steps+items+tip+'</article>'+
    '<div class="man-nav">'+(prev?'<button class="btn ghost" type="button" data-act="manOpen" data-v="'+prev.id+'">‹ '+esc(prev.title)+'</button>':'<span></span>')+(next?'<button class="btn" type="button" data-act="manOpen" data-v="'+next.id+'">'+esc(next.title)+' ›</button>':'')+'</div>';
}

async function accountDo(key,fn,ok){
  await withBusy(key,async()=>{try{await fn();if(ok)toast(ok)}catch(e){toast((e&&(e.message||e.error))||'No se pudo guardar.')}});
}
Object.assign(ACT,{
  saveProfile:()=>{const f={displayName:$('#acName').value.trim(),username:$('#acUser').value.trim(),email:$('#acEmail').value.trim()};
    if(!f.email){toast('Escribe tu correo.');$('#acEmail').focus();return}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email)){toast('El correo no parece válido. Revisa que tenga @ y un dominio, por ejemplo nombre@gmail.com.');$('#acEmail').focus();return}
    accountDo('profile',async()=>{V.me=await ACC().update(f);V.draft={}},'Perfil guardado.')},
  removePhoto:()=>accountDo('photo',async()=>{V.me=await ACC().update({avatar:''})},'Foto quitada.'),
  changePw:()=>{const a=$('#acCur').value,b=$('#acNew').value,c=$('#acNew2').value;
    if(b.length<6){toast('La contraseña nueva debe tener al menos 6 caracteres.');return}
    if(b!==c){toast('Las dos contraseñas nuevas no coinciden.');return}
    accountDo('pw',async()=>{await ACC().password(a,b);['acCur','acNew','acNew2'].forEach(id=>{const el=$('#'+id);if(el)el.value=''})},'Contraseña cambiada.')},
  logout:()=>ACC()&&ACC().logout(),
  delAccount:()=>openModal('<h3>Eliminar tu cuenta</h3><p class="muted" style="margin:0">Se borrarán para siempre tu temario, tarjetas, progreso y los grupos que hayas creado. Escribe tu contraseña para confirmarlo.</p><label class="lbl" for="mPw">Contraseña<input type="password" id="mPw" autocomplete="current-password"></label><div class="row" style="justify-content:flex-end"><button class="btn ghost" type="button" data-mact="cancel">Cancelar</button><button class="btn" style="background:var(--bad);color:#fff" type="button" data-mact="ok">Eliminar para siempre</button></div>',b=>{
    b.onclick=async e=>{const a=e.target.closest('[data-mact]');if(!a)return;if(a.dataset.mact==='cancel')return closeModal();a.disabled=true;try{await ACC().remove($('#mPw').value)}catch(err){a.disabled=false;toast(err.message||'No se pudo eliminar.')}}}),
  theme:b=>{applyTheme(b.dataset.v);saveMeta();render()},
  reloadApp:()=>reloadApp(),

    accountDo('contact',async()=>{await ACC().contact(kind,subj,body);['ctKind','ctSubj','ctBody'].forEach(k=>delete V.draft[k])},'Mensaje enviado. ¡Gracias!')},
  installApp:async()=>{const IN=window.mnemaInstall;if(!IN)return;const ok=await IN.prompt();if(ok)toast('Mnema se ha instalado.');render()}
});
function onAccountChange(el){
  if(el.id==='acPhoto'){const f=el.files&&el.files[0];el.value='';if(!f||!ACC())return;
    accountDo('photo',async()=>{const blob=await shrinkImage(f,512);V.me=await ACC().avatar(blob)},'Foto actualizada.');return true}
